<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Inventory</title>
<meta name="description" content="Kitchen inventory — ingredients, snacks, equipment — and a shopping list">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- iOS Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f5f5f2;
    --bg-blur: rgba(245, 245, 242, .86);
    --surface: #ffffff;
    --surface-2: #f2f1ed;
    --fill: #ebeae5;
    --text: #1b1a19;
    --text-dim: #85817c;
    --hair: #efeeea;
    --border: #e3e1dc;
    --accent: #ff6b3d;
    --accent-soft: #ffede5;
    --have: #23945a;
    --have-bg: #e3f4ea;
    --low: #bb7605;
    --low-bg: #fdf1d9;
    --out: #e0453a;
    --out-bg: #fde7e4;
    --shadow: 0 1px 2px rgba(20, 16, 12, .04), 0 6px 18px rgba(20, 16, 12, .05);
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --bg-blur: rgba(18, 17, 16, .86);
      --surface: #1c1b19;
      --surface-2: #262422;
      --fill: #2a2826;
      --text: #f3f1ee;
      --text-dim: #9a958f;
      --hair: #292724;
      --border: #34312d;
      --accent: #ff7a50;
      --accent-soft: #3a2419;
      --have: #5fd08f;
      --have-bg: #173022;
      --low: #f0b64a;
      --low-bg: #33280f;
      --out: #ff7b70;
      --out-bg: #3a1c19;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  input, textarea { font-size: 16px; } /* < 16px makes iOS Safari zoom on focus */
  button { cursor: pointer; border: none; background: none; padding: 0; transition: transform .08s, opacity .1s; }
  button:active { transform: scale(.96); }
  [hidden] { display: none !important; }
  svg { display: block; }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* ---- Login ---- */
  #login {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    gap: 12px; padding: 24px; max-width: 380px; margin: 0 auto;
  }
  #login .logo {
    width: 72px; height: 72px; border-radius: 22px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    box-shadow: 0 10px 28px rgba(255, 107, 61, .35); margin-bottom: 8px;
  }
  #login h1 { font: 800 30px/1.1 var(--rounded); margin: 0; letter-spacing: -.02em; }
  #login p { color: var(--text-dim); margin: 0 0 14px; }
  #login input {
    width: 100%; padding: 15px 16px; border-radius: 14px;
    border: none; background: var(--surface); box-shadow: var(--shadow);
  }
  #login button {
    width: 100%; padding: 15px; border-radius: 14px; margin-top: 4px;
    background: var(--accent); color: #fff; font-weight: 700;
  }
  #login .err { color: var(--out); min-height: 20px; font-size: 14px; }

  /* ---- App shell ---- */
  #app { min-height: 100dvh; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(var(--safe-top) + 12px) 16px 10px;
    background: var(--bg-blur);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .title-row h1 {
    font: 800 30px/1.15 var(--rounded); letter-spacing: -.02em; margin: 0 auto 0 0;
  }
  .pill {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim); white-space: nowrap;
  }
  .pill.ok   { background: var(--have-bg); color: var(--have); }
  .pill.warn { background: var(--low-bg); color: var(--low); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
  }

  main { padding: 4px 16px calc(150px + var(--safe-bottom)); }
  main.wrap { box-sizing: content-box; } /* so the list lines up with the header controls */

  /* segmented control (iOS-style) */
  .seg { display: flex; gap: 2px; background: var(--fill); border-radius: 12px; padding: 3px; margin-top: 12px; }
  .seg button {
    flex: 1; padding: 8px 4px; border-radius: 9px; font-size: 14px; font-weight: 600;
    color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button:active { transform: none; }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
  .seg-count { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .seg-count:empty { display: none; }

  .search {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    background: var(--fill); border-radius: 12px; padding: 0 12px; color: var(--text-dim);
  }
  .search input { flex: 1; min-width: 0; border: none; background: transparent; padding: 10px 0; outline: none; color: var(--text); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { color: var(--text-dim); font-size: 18px; padding: 4px; line-height: 1; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  }
  .chip.active { background: var(--text); color: var(--bg); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.low { background: var(--low); }
  .dot.out { background: var(--out); }

  /* ---- Cards + rows ---- */
  .list-top { height: 14px; }
  .card {
    position: relative; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .cat-head { position: relative; display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; }
  .cat-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 2px 0; }
  .cat-toggle:active { transform: none; }
  .cat-emoji {
    width: 34px; height: 34px; border-radius: 11px; flex: none; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2);
    background: color-mix(in srgb, var(--catclr, var(--accent)) 14%, transparent);
  }
  .cat-name { font: 700 16.5px/1.2 var(--rounded); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-count { color: var(--text-dim); font-size: 13px; font-weight: 600; flex: none; }
  .chev { color: var(--text-dim); transition: transform .18s; flex: none; margin-left: 2px; }
  .collapsed .chev { transform: rotate(-90deg); }
  .collapsed .rows, .collapsed .quick-add-row { display: none; }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface-2); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; line-height: 1;
  }
  .icon-btn.add { color: var(--accent); background: var(--accent-soft); font-size: 22px; font-weight: 600; }
  .cat-rename-input {
    flex: 1; min-width: 0; font-weight: 700; padding: 8px 10px;
    border-radius: 10px; border: none; background: var(--surface-2); outline: 2px solid var(--accent);
  }

  .rows { padding-bottom: 4px; }
  .item-row {
    position: relative; display: flex; align-items: center; gap: 10px;
    min-height: 56px; padding: 0 10px 0 14px;
  }
  .item-row + .item-row::before {
    content: ''; position: absolute; top: 0; left: 14px; right: 14px; height: 1px; background: var(--hair);
  }
  .item-main {
    flex: 1; min-width: 0; text-align: left; padding: 10px 0;
    display: flex; flex-direction: column; gap: 1px;
  }
  .item-main:active { transform: none; opacity: .6; }
  .item-name { font-size: 15.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-note { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-note.bad { color: var(--out); font-weight: 600; }
  .item-row.staple .item-name { color: var(--text-dim); }
  .on-list { flex: none; color: var(--accent); display: flex; }
  .thumb {
    width: 38px; height: 38px; border-radius: 12px; flex: none; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .item-row.zero .thumb { filter: grayscale(1); opacity: .55; }
  .item-row.zero .item-name { color: var(--text-dim); }

  .state-chip {
    flex: none; min-width: 84px; padding: 7px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .state-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .state-chip.have { background: var(--have-bg); color: var(--have); }
  .state-chip.low  { background: var(--low-bg);  color: var(--low); }
  .state-chip.out  { background: var(--out-bg);  color: var(--out); }

  .stepper { flex: none; display: flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .stepper button {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
    font-size: 19px; font-weight: 600; line-height: 1; color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08); display: flex; align-items: center; justify-content: center;
  }
  .stepper button[disabled] { opacity: .35; }
  .stepper .count { min-width: 34px; text-align: center; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }

  .quick-add-row { display: flex; gap: 6px; padding: 0 10px 10px 12px; }
  .quick-add-row input {
    min-width: 0; padding: 11px 12px; border-radius: 12px; border: none; background: var(--surface-2);
  }
  .quick-add-row .qa-name { flex: 1; }
  .quick-add-row .qa-qty { width: 76px; }
  .quick-add-row .qa-go { background: var(--accent); color: #fff; font-weight: 700; padding: 0 16px; border-radius: 12px; }

  .add-category-bar { display: flex; gap: 8px; margin: 4px 0 12px; }
  .add-category-bar input {
    flex: 1; min-width: 0; padding: 13px 14px; border-radius: 14px;
    border: 1.5px dashed var(--border); background: transparent;
  }
  .add-category-bar input:placeholder-shown + button { display: none; }
  .add-category-bar button {
    padding: 0 16px; border-radius: 14px; color: var(--accent); font-weight: 700;
    background: var(--accent-soft); white-space: nowrap;
  }

  .menu {
    position: absolute; right: 8px; top: 48px; z-index: 6; min-width: 170px;
    background: var(--surface); border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .18), 0 0 0 1px var(--border);
  }
  .menu button { display: block; width: 100%; padding: 13px 16px; text-align: left; font-size: 15px; }
  .menu button:active { transform: none; background: var(--surface-2); }
  .menu button + button { border-top: 1px solid var(--hair); }
  .menu button.danger { color: var(--out); }

  .empty { color: var(--text-dim); text-align: center; padding: 48px 20px; line-height: 1.55; }
  .empty .big { font-size: 46px; margin-bottom: 8px; }
  .empty b { color: var(--text); display: block; font: 700 18px/1.3 var(--rounded); margin-bottom: 4px; }
  .empty.small { padding: 4px 14px 14px; font-size: 13.5px; text-align: left; }
  .footnote { color: var(--text-dim); font-size: 13px; text-align: center; margin: 4px 0 12px; }

  /* ---- Shopping ---- */
  .shop-summary { padding: 16px 16px 14px; margin-top: 14px; }
  .ss-top { display: flex; align-items: flex-end; gap: 12px; }
  .ss-big { font: 800 34px/1 var(--rounded); letter-spacing: -.02em; }
  .ss-sub { color: var(--text-dim); font-size: 14px; font-weight: 600; margin-top: 4px; }
  .ss-top .grow { flex: 1; }
  .pill-btn {
    font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 8px 13px; border-radius: 999px; white-space: nowrap;
  }
  .progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 14px; }
  .progress span { display: block; height: 100%; border-radius: 99px; background: var(--have); transition: width .25s ease; }

  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: #fff;
    transition: background .15s, border-color .15s;
  }
  .check svg { opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .shop-row.checked .check { background: var(--have); border-color: var(--have); }
  .shop-row.checked .check svg { opacity: 1; transform: none; }
  .shop-row.checked .item-name { color: var(--text-dim); text-decoration: line-through; }
  .row-x { flex: none; color: var(--text-dim); font-size: 22px; line-height: 1; padding: 6px 6px; }
  .src-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 2px 6px; border-radius: 6px; background: var(--out-bg); color: var(--out); margin-left: 4px; vertical-align: 1px;
  }

  /* ---- FAB + bottom tabs ---- */
  #fab {
    position: fixed; z-index: 31; right: max(16px, calc(50% - 344px));
    bottom: calc(80px + var(--safe-bottom));
    width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(255, 107, 61, .4), 0 2px 6px rgba(0, 0, 0, .12);
  }
  body.typing #fab { opacity: 0; pointer-events: none; transform: scale(.8); }
  #fab { transition: opacity .15s, transform .15s; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: center; gap: 8px;
    background: var(--bg-blur); border-top: 1px solid var(--hair);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
    padding: 6px 12px calc(6px + var(--safe-bottom));
  }
  nav.tabs button {
    flex: 1; max-width: 200px; padding: 6px 4px; font-size: 11.5px; font-weight: 700;
    color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button:active { transform: none; }
  nav.tabs button.active { color: var(--accent); }
  .ico { position: relative; }
  .tab-badge {
    position: absolute; top: -4px; right: -10px; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    box-shadow: 0 0 0 2px var(--bg);
  }

  /* ---- Bottom sheet ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, .38); animation: fade-in .18s ease;
  }
  #sheet .card {
    width: 100%; max-width: 560px; margin: 0; border-radius: 24px 24px 0 0;
    padding: 8px 18px calc(20px + var(--safe-bottom));
    max-height: 92dvh; overflow: auto; animation: sheet-up .24s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--border); margin: 2px auto 12px; }
  .sheet-head { display: flex; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { font: 800 22px/1.2 var(--rounded); margin: 0 auto 0 0; letter-spacing: -.01em; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dim); margin: 0 0 7px 2px; }
  .field input[type=text], .field textarea, .field input[type=email] {
    width: 100%; padding: 13px 14px; border-radius: 13px; border: none; background: var(--surface-2); outline: none;
  }
  .field input:focus, .field textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
  .field .chips { padding: 0 0 8px; flex-wrap: wrap; overflow: visible; }
  .field .chip { box-shadow: none; background: var(--surface-2); }
  .field .chip.active { background: var(--text); color: var(--bg); }
  .seg.states { margin: 0; }
  .seg.states button.active.have { color: var(--have); }
  .seg.states button.active.low { color: var(--low); }
  .seg.states button.active.out { color: var(--out); }
  .big-stepper { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 4px 0; }
  .big-stepper button {
    width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2);
    font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .big-stepper .count { font: 800 34px/1 var(--rounded); min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
  .toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 13px; background: var(--surface-2); }
  .toggle-row span { flex: 1; font-size: 14px; }
  .toggle-row small { display: block; color: var(--text-dim); font-size: 12.5px; }
  .toggle-row input { width: 22px; height: 22px; accent-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 15px; border-radius: 15px; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 16px; margin-top: 4px;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-soft {
    flex: 1; padding: 13px; border-radius: 14px; background: var(--surface-2); font-weight: 700; font-size: 14.5px;
  }
  .btn-soft.danger { color: var(--out); background: var(--out-bg); }
  .btn-soft.accent { color: var(--accent); background: var(--accent-soft); }
  .hint { color: var(--text-dim); font-size: 12.5px; text-align: center; margin: 10px 0 0; }
  .acct-status { padding: 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; margin-bottom: 12px; }
  .acct-status b { display: block; font-size: 15px; margin-bottom: 2px; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; z-index: 60; left: 16px; right: 88px;
    bottom: calc(84px + var(--safe-bottom));
    background: #232120; color: #fff; border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .3);
    animation: toast-in .2s ease;
  }
  @keyframes toast-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  #toast .toast-msg { flex: 1; font-size: 14px; }
  #toast .toast-undo { color: #ffae8f; font-weight: 800; padding: 4px; font-size: 14px; }

  @media (min-width: 760px) {
    #sheet { align-items: center; }
    #sheet .card { border-radius: 24px; padding-bottom: 20px; }
    .grabber { visibility: hidden; height: 0; margin-bottom: 8px; }
    #toast { left: 50%; right: auto; width: 440px; transform: translateX(-50%); animation: none; }
  }
  @media (min-width: 980px) {
    .wrap { max-width: 1000px; }
    #fab { right: max(16px, calc(50% - 484px)); }
    .cat-grid { columns: 2; column-gap: 16px; }
    .cat-grid > .card { break-inside: avoid; display: inline-block; width: 100%; }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="logo">🧺</div>
  <h1>Kitchen</h1>
  <p>Your pantry, snacks, gear and shopping list — on every device.</p>
  <input id="login-email" type="email" autocomplete="username" inputmode="email" placeholder="Email">
  <input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
  <div class="err" id="login-err"></div>
  <button id="login-go">Sign in</button>
</div>

<div id="app" hidden>
  <div class="topbar">
    <div class="wrap">
      <div class="title-row">
        <h1 id="page-title">Inventory</h1>
        <span class="pill" id="sync-pill">…</span>
        <button class="avatar" id="acct-btn" data-act="open-account" aria-label="Account">·</button>
      </div>
      <div id="inv-controls">
