      return { done: done, remaining: state.queue.length, blocked: state.blocked };
    }, function (err) {
      state.blocked = countParked();
      state.syncing = false; renderSync();
      return { done: done, remaining: state.queue.length, error: err };
    });
  }

  function sendOp(op) {
    if (!client) return Promise.reject(new Error('no client'));
    var t = client.from(op.table || T_ITEMS);
    var p;
    if (op.kind === 'insert') {
      p = t.upsert(pickCols(op.table, op.row), { onConflict: 'id', ignoreDuplicates: true });
    } else if (op.kind === 'update') {
      p = t.update(op.patch).eq('id', op.id);
    } else if (op.kind === 'delete') {
      p = t.delete().eq('id', op.id);
    } else {
      return Promise.reject(new Error('unknown op ' + op.kind));
    }
    return Promise.resolve(p).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }
  function pickCols(table, row) {
    var out = {}, cols = COLS[table] || COLS[T_ITEMS];
    cols.forEach(function (c) { if (row[c] !== undefined) out[c] = row[c]; });
    return out;
  }

  // --------------------------------------------------------- server sync
  function reconcile() {
    if (!client || !state.session) return Promise.resolve();
    // flush() manages state.syncing itself; don't set it here or flush() no-ops.
    return flush().then(function () {
      state.syncing = true; renderSync();
      return client.from(T_ITEMS).select('*');
    }).then(function (res) {
      if (!res || res.error) throw (res && res.error) || new Error('fetch failed');
      state.items = applyOps(res.data || [], queueFor(T_ITEMS), T_ITEMS);
      // Shopping lives in its own migration — fetched best-effort so a device
      // that hasn't run it yet still syncs inventory just fine.
      return Promise.all([
        Promise.resolve(client.from(T_SHOP_CATS).select('*')).catch(function (e) { return { error: e }; }),
        Promise.resolve(client.from(T_SHOP_ITEMS).select('*')).catch(function (e) { return { error: e }; })
      ]);
    }).then(function (shopRes) {
      if (shopRes[0] && !shopRes[0].error) state.shoppingCategories = applyOps(shopRes[0].data || [], queueFor(T_SHOP_CATS), T_SHOP_CATS);
      if (shopRes[1] && !shopRes[1].error) state.shoppingItems = applyOps(shopRes[1].data || [], queueFor(T_SHOP_ITEMS), T_SHOP_ITEMS);
      persist();
      state.syncing = false;
      renderAll();
      return true;
    }, function () {
      state.syncing = false;
      renderSync();
      return false;
    });
  }

  // ------------------------------------------------------- actions: items
  // kind: 'ingredient' | 'snack' | 'equipment'.
  // opts.state: starting state for an ingredient (default 'have').
  // opts.qty:   starting count for a snack / equipment (default 1).
  // Adding a snack or piece of equipment you already have just bumps its
  // count instead of creating a duplicate row.
  function addItem(kind, name, category, opts) {
    opts = opts || {};
    name = (name || '').trim();
    if (!name) return null;
    var counted = isCounted(kind);
    var qty = counted ? Math.max(0, Math.floor(opts.qty == null ? 1 : Number(opts.qty) || 0)) : null;
    var dup = null;
    state.items.forEach(function (i) { if (i.kind === kind && lc(i.name) === lc(name)) dup = i; });
    if (dup) {
      if (counted) {
        setCount(dup.id, countOf(dup) + (qty || 1));
        toast(dup.name + ' — you now have ' + countOf(dup));
        return dup;
      }
      toast(dup.name + ' is already in your inventory');
      return null;
    }
    var row = {
      id: uuid(), user_id: uid(), name: name, kind: kind,
      state: counted ? (qty > 0 ? 'have' : 'out') : (STATE_CYCLE.indexOf(opts.state) !== -1 ? opts.state : 'have'),
      category: (!counted && category && String(category).trim()) || null,
      is_staple: false, notes: null, created_at: iso(), updated_at: iso()
    };
    // Only counted rows carry qty — an ingredient insert never mentions the
    // column, so it still syncs on a database that hasn't run the qty migration.
    if (counted) row.qty = qty;
    state.items.push(row);
    persist('items');
    enqueue({ table: T_ITEMS, kind: 'insert', row: cloneRow(row) });
    if (row.state === 'out') cartFollow(row, 'have', 'out');
    renderAll();
    return row;
  }

  // Keep the shopping list in step with inventory: running out puts the
  // item on the list, un-running-out takes it back off (only while it's
  // still unchecked — a ticked item is a record of what you bought).
  // Returns a short note for the toast.
  function cartFollow(it, from, to) {
    if (!it || it.kind === 'equipment' || it.is_staple) return '';
    if (to === 'out' && from !== 'out') {
      return ensureOnList(it.name, it.kind === 'snack' ? SNACK_SHOP_CATEGORY : (it.category || DEFAULT_SHOP_CATEGORY))
        ? ' · added to shopping list' : '';
    }
    if (from === 'out' && to !== 'out') {
      return removeFromList(it.name) ? ' · off shopping list' : '';
    }
    return '';
  }

  // Snapshots the exact prior state (value + updated_at) so undo restores it
  // byte-for-byte, not just "some earlier-looking value".
  function applyStateChange(id, newState, undoLabel) {
    var it = byId(id);
    if (!it || it.state === newState) return;
    var from = it.state;
    var snap = { state: it.state, updated_at: it.updated_at };
    it.state = newState;
    it.updated_at = iso();
    persist('items');
    enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: { state: newState } });
    var note = cartFollow(it, from, newState);
    renderAll();
    if (undoLabel) toast(undoLabel + note, function () {
      var cur = byId(id);
      if (!cur) return;
      var was = cur.state;
      cur.state = snap.state;
      cur.updated_at = snap.updated_at;
      persist('items');
      enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: { state: snap.state } });
      cartFollow(cur, was, snap.state);
      renderAll();
    });
  }

  function cycleState(id) {
    var it = byId(id);
    if (!it) return;
    var to = nextState(it.state);
    applyStateChange(id, to, it.name + ' → ' + STATE_LABEL[to]);
  }

  // Counts for snacks / equipment. `state` mirrors the count (0 = out) so
  // older clients and the shopping hook both read it correctly.
  function setCount(id, n) {
    var it = byId(id);
    if (!it || !isCounted(it.kind)) return;
    n = Math.max(0, Math.floor(Number(n) || 0));
    var from = countOf(it);
    if (n === from && typeof it.qty === 'number') return;
    var fromState = it.state;
    it.qty = n;
    it.state = n > 0 ? 'have' : 'out';
    it.updated_at = iso();
    persist('items');
    enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: { qty: n, state: it.state } });
    var note = cartFollow(it, fromState, it.state);
    renderAll();
    if (note) toast(it.name + note, function () { setCount(id, from); });
  }
  function stepCount(id, delta) {
    var it = byId(id);
    if (it) setCount(id, countOf(it) + delta);
  }

  function editItem(id, patch, undoLabel) {
    var it = byId(id);
    if (!it) return;
    var before = { updated_at: it.updated_at };
    for (var k in patch) before[k] = it[k];
    for (var j in patch) it[j] = patch[j];
    it.updated_at = iso();
    persist('items'); renderAll();
    enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: cloneRow(patch) });
    if (undoLabel) toast(undoLabel, function () {
      var cur = byId(id);
      if (!cur) return;
      for (var b in before) cur[b] = before[b];
      persist('items'); renderAll();
      var revert = {};
      for (var p in patch) revert[p] = before[p];
      enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: revert });
    });
  }

  function deleteItem(id) {
    var idx = state.items.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var row = state.items.splice(idx, 1)[0];
    persist('items'); renderAll();
    enqueue({ table: T_ITEMS, kind: 'delete', id: id });
    toast('Deleted ' + row.name, function () {
      state.items.push(row);
      persist('items'); renderAll();
      enqueue({ table: T_ITEMS, kind: 'insert', row: cloneRow(row) });
    });
  }

  // ---------------------------------------- actions: ingredient categories
  // Ingredient categories are a free-text field on each item — a category
  // with nothing in it yet has nowhere to live, so these placeholder names
  // give "+ Add category" somewhere to put an empty group before its first
  // item exists. Device-local (state.ui, not synced) and self-pruning: once a
  // real item uses the name it drops out (see activePlaceholders).
  function addInventoryCategory(name) {
    name = (name || '').trim();
    if (!name) return;
    var exists = ingredientCategoryNames().some(function (c) { return lc(c) === lc(name); });
    if (exists) return;
    state.ui.inventoryCategories.push(name);
    persist('ui'); renderInventory();
  }
  function removeInventoryCategory(name) {
    state.ui.inventoryCategories = state.ui.inventoryCategories.filter(function (c) { return c !== name; });
    persist('ui'); renderInventory();
  }

  // Move every ingredient in category `oldName` to `newName` (rename), or to
  // no category when newName is null (delete the category, keep the items).
  // One undo restores every row exactly.
  function recategorize(oldName, newName) {
    newName = newName == null ? null : (String(newName).trim() || null);
    var isUncat = oldName === 'Uncategorized';
    var rows = state.items.filter(function (i) {
      return i.kind === 'ingredient' && (isUncat ? !i.category : lc(i.category) === lc(oldName));
    });
    var placeholderIdx = state.ui.inventoryCategories.indexOf(oldName);
    if (newName && lc(newName) === lc(oldName) && newName === oldName) return;
    var snaps = rows.map(function (i) { return { id: i.id, category: i.category, updated_at: i.updated_at }; });
    rows.forEach(function (i) {
      i.category = newName;
      i.updated_at = iso();
      enqueue({ table: T_ITEMS, kind: 'update', id: i.id, patch: { category: newName } });
    });
    if (placeholderIdx !== -1) {
      if (newName) state.ui.inventoryCategories[placeholderIdx] = newName;
      else state.ui.inventoryCategories.splice(placeholderIdx, 1);
    }
    if (newName && state.ui.collapsed[oldName]) { state.ui.collapsed[newName] = true; delete state.ui.collapsed[oldName]; }
    persist(); renderAll();
    if (!rows.length) return;
    toast(newName ? 'Renamed to ' + newName : 'Removed ' + oldName + ' — ' + plural(rows.length, 'item') + ' now uncategorized', function () {
      snaps.forEach(function (s) {
        var cur = byId(s.id);
        if (!cur) return;
        cur.category = s.category;
        cur.updated_at = s.updated_at;
        enqueue({ table: T_ITEMS, kind: 'update', id: s.id, patch: { category: s.category } });
      });
      if (placeholderIdx !== -1 && state.ui.inventoryCategories.indexOf(oldName) === -1) {
        if (newName) state.ui.inventoryCategories = state.ui.inventoryCategories.filter(function (c) { return c !== newName; });
        state.ui.inventoryCategories.push(oldName);
      }
      persist(); renderAll();
    });
  }

  // ------------------------------------------------------- actions: shopping
  function addShoppingCategory(name) {
    name = (name || '').trim();
    if (!name) return null;
    var existing = shoppingCategoryNamed(name);
    if (existing) return existing;
    var maxSort = state.shoppingCategories.reduce(function (m, c) { return Math.max(m, c.sort_order || 0); }, 0);
    var row = { id: uuid(), user_id: uid(), name: name, sort_order: maxSort + 1, created_at: iso() };
    state.shoppingCategories.push(row);
    persist('shoppingCategories'); renderAll();
    enqueue({ table: T_SHOP_CATS, kind: 'insert', row: cloneRow(row) });
    return row;
  }
  function shoppingCategoryNamed(name) {
    for (var i = 0; i < state.shoppingCategories.length; i++) {
      if (lc(state.shoppingCategories[i].name) === lc(name)) return state.shoppingCategories[i];
    }
    return null;
  }
  function renameShoppingCategory(id, name) {
    var c = findById(state.shoppingCategories, id);
    name = (name || '').trim();
    if (!c || !name || name === c.name) return;
    c.name = name;
    persist('shoppingCategories'); renderAll();
    enqueue({ table: T_SHOP_CATS, kind: 'update', id: id, patch: { name: name } });
  }
  function deleteShoppingCategory(id) {
    var idx = state.shoppingCategories.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var cat = state.shoppingCategories.splice(idx, 1)[0];
    var lines = state.shoppingItems.filter(function (it) { return it.category_id === id; });
    state.shoppingItems = state.shoppingItems.filter(function (it) { return it.category_id !== id; });
    persist(); renderAll();
    lines.forEach(function (it) { enqueue({ table: T_SHOP_ITEMS, kind: 'delete', id: it.id }); });
    enqueue({ table: T_SHOP_CATS, kind: 'delete', id: id });
    var extra = lines.length ? (' and ' + plural(lines.length, 'item')) : '';
    toast('Deleted ' + cat.name + extra, function () {
      state.shoppingCategories.push(cat);
      lines.forEach(function (it) { state.shoppingItems.push(it); });
      persist(); renderAll();
      enqueue({ table: T_SHOP_CATS, kind: 'insert', row: cloneRow(cat) });
      lines.forEach(function (it) { enqueue({ table: T_SHOP_ITEMS, kind: 'insert', row: cloneRow(it) }); });
    });
  }
  function addShoppingItem(categoryId, name, qty) {
    name = (name || '').trim();
    if (!name || !findById(state.shoppingCategories, categoryId)) return null;
    var maxSort = state.shoppingItems.reduce(function (m, it) {
      return it.category_id === categoryId ? Math.max(m, it.sort_order || 0) : m;
    }, 0);
    var row = {
      id: uuid(), user_id: uid(), category_id: categoryId, name: name,
      qty: (qty || '').trim() || null, checked: false, sort_order: maxSort + 1, created_at: iso()
    };
    state.shoppingItems.push(row);
    persist('shoppingItems'); renderAll();
    enqueue({ table: T_SHOP_ITEMS, kind: 'insert', row: cloneRow(row) });
    return row;
  }

  // Put `name` on the list under category `catName` (created if needed).
  // No-op if it's already there unchecked; a checked copy is simply
  // un-ticked rather than duplicated. Returns true if the list changed.
  function ensureOnList(name, catName) {
    var matches = state.shoppingItems.filter(function (si) { return lc(si.name) === lc(name); });
    if (matches.some(function (si) { return !si.checked; })) return false;
    if (matches.length) {
      var m = matches[0];
      m.checked = false;
      persist('shoppingItems');
      enqueue({ table: T_SHOP_ITEMS, kind: 'update', id: m.id, patch: { checked: false } });
      return true;
    }
    var cat = addShoppingCategory(catName || DEFAULT_SHOP_CATEGORY);
    return !!(cat && addShoppingItem(cat.id, name, ''));
  }
  // Take every still-unchecked `name` off the list. Returns true if any went.
  function removeFromList(name) {
    var gone = state.shoppingItems.filter(function (si) { return !si.checked && lc(si.name) === lc(name); });
    if (!gone.length) return false;
    state.shoppingItems = state.shoppingItems.filter(function (si) { return gone.indexOf(si) === -1; });
    persist('shoppingItems');
    gone.forEach(function (si) { enqueue({ table: T_SHOP_ITEMS, kind: 'delete', id: si.id }); });
    return true;
  }
  function addToListFromInventory(id) {
    var it = byId(id);
    if (!it) return;
    var cat = it.kind === 'snack' ? SNACK_SHOP_CATEGORY : it.kind === 'equipment' ? DEFAULT_SHOP_CATEGORY : (it.category || DEFAULT_SHOP_CATEGORY);
    var added = ensureOnList(it.name, cat);
    renderAll();
    toast(added ? it.name + ' added to shopping list' : it.name + ' is already on your list');
  }

  // Ticking an item off the list = you bought it: if it matches an ingredient
  // that's low/out, that goes back to "In stock"; a snack at 0 goes to 1.
  // One undo reverts both the tick and the restock.
  function toggleShoppingItem(id) {
    var si = findById(state.shoppingItems, id);
    if (!si) return;
    si.checked = !si.checked;
    persist('shoppingItems');
    enqueue({ table: T_SHOP_ITEMS, kind: 'update', id: id, patch: { checked: si.checked } });
    var restock = si.checked ? restockFromList(si.name) : null;
    renderAll();
    if (restock) {
      toast('Got ' + si.name + ' — back in stock', function () {
        var cur = findById(state.shoppingItems, id);
        if (cur) {
          cur.checked = false;
          persist('shoppingItems');
          enqueue({ table: T_SHOP_ITEMS, kind: 'update', id: id, patch: { checked: false } });
        }
        var it = byId(restock.id);
        if (it) {
          for (var k in restock.before) it[k] = restock.before[k];
          persist('items');
          enqueue({ table: T_ITEMS, kind: 'update', id: it.id, patch: restock.patch });
        }
        renderAll();
      });
    }
  }
  function restockFromList(name) {
    var it = null;
    state.items.forEach(function (i) {
      if (it || lc(i.name) !== lc(name)) return;
      if (i.kind === 'ingredient' && i.state !== 'have') it = i;
      else if (i.kind === 'snack' && countOf(i) === 0) it = i;
    });
    if (!it) return null;
    var before = { state: it.state, updated_at: it.updated_at };
    var patch = { state: 'have' };
    var revert = { state: it.state };
    if (it.kind === 'snack') {
      before.qty = it.qty;
      patch.qty = 1;
      revert.qty = typeof it.qty === 'number' ? it.qty : 0;
    }
    for (var k in patch) it[k] = patch[k];
    it.updated_at = iso();
    persist('items');
    enqueue({ table: T_ITEMS, kind: 'update', id: it.id, patch: patch });
    return { id: it.id, before: before, patch: revert };
  }

  function editShoppingItem(id, patch) {
    var it = findById(state.shoppingItems, id);
    if (!it) return;
    for (var k in patch) it[k] = patch[k];
    persist('shoppingItems'); renderAll();
    enqueue({ table: T_SHOP_ITEMS, kind: 'update', id: id, patch: cloneRow(patch) });
  }
  function removeShoppingItem(id) {
    var idx = state.shoppingItems.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var row = state.shoppingItems.splice(idx, 1)[0];
    persist('shoppingItems'); renderAll();
    enqueue({ table: T_SHOP_ITEMS, kind: 'delete', id: id });
    toast('Removed ' + row.name, function () {
      state.shoppingItems.push(row);
      persist('shoppingItems'); renderAll();
      enqueue({ table: T_SHOP_ITEMS, kind: 'insert', row: cloneRow(row) });
    });
  }
  function clearCheckedShopping() {
    var lines = state.shoppingItems.filter(function (it) { return it.checked; });
    if (!lines.length) return;
    state.shoppingItems = state.shoppingItems.filter(function (it) { return !it.checked; });
    persist('shoppingItems'); renderAll();
    lines.forEach(function (it) { enqueue({ table: T_SHOP_ITEMS, kind: 'delete', id: it.id }); });
    toast('Cleared ' + plural(lines.length, 'checked item'), function () {
      lines.forEach(function (it) { state.shoppingItems.push(it); });
      persist('shoppingItems'); renderAll();
      lines.forEach(function (it) { enqueue({ table: T_SHOP_ITEMS, kind: 'insert', row: cloneRow(it) }); });
    });
  }

  // -------------------------------------------------------------- toast
  function toast(msg, onUndo) {
    var el = $('#toast');
    if (!el) return;
    el.querySelector('.toast-msg').textContent = msg;
    var btn = el.querySelector('.toast-undo');
    btn.hidden = !onUndo;
    btn.onclick = function () {
      clearTimeout(toastTimer);
      el.hidden = true;
      if (onUndo) onUndo();
    };
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 5000);
  }

  // ------------------------------------------------------------ rendering
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  var CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  var CART_MINI = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h2.2l2.3 11h10.8l2-8H6.3"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>';

  function renderAll() {
    try {
      renderChrome();
      renderInventory();
      renderShopping();
      renderSync();
    } catch (e) { /* jsdom / detached DOM during tests */ }
  }

  function renderChrome() {
    var tab = state.ui.tab;
    var title = $('#page-title');
    if (title) title.textContent = tab === 'shopping' ? 'Shopping list' : 'Inventory';
    var tabsWrap = $('nav.tabs');
    if (tabsWrap) tabsWrap.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    var inv = $('#view-inventory'), shop = $('#view-shopping'), ctl = $('#inv-controls');
    if (inv) inv.hidden = tab !== 'inventory';
    if (ctl) ctl.hidden = tab !== 'inventory';
    if (shop) shop.hidden = tab !== 'shopping';
    var fab = $('#fab');
    if (fab) fab.setAttribute('aria-label', tab === 'shopping' ? 'Add to shopping list' : 'Add ' + KIND_LABEL[KIND_OF[state.ui.invSection]]);
    var av = $('#acct-btn');
    var email = state.session && state.session.user && state.session.user.email;
    if (av) av.textContent = email ? email.charAt(0) : '·';
  }

  // Rebuild a container's HTML without losing an input the user is typing in
  // (a background sync can re-render at any moment). Inputs that should
  // survive carry a stable data-keep key. Returns true if one was restored.
  function setHtmlKeepingInput(host, html) {
    var a = document.activeElement, keep = null;
    if (a && host.contains(a) && a.hasAttribute && a.hasAttribute('data-keep')) {
      keep = { key: a.getAttribute('data-keep'), value: a.value, s: a.selectionStart, e: a.selectionEnd };
    }
    host.innerHTML = html;
    if (!keep) return false;
    var el = null;
    host.querySelectorAll('[data-keep]').forEach(function (x) { if (!el && x.getAttribute('data-keep') === keep.key) el = x; });
    if (!el) return false;
    el.value = keep.value;
    el.focus();
    try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text input */ }
    return true;
  }

  // A placeholder category (added via "+ Add category" but not yet used)
  // stops being a placeholder the moment something real uses its name.
  function activePlaceholders(names, hasReal) {
    return (names || []).filter(function (name) { return !hasReal(name); });
  }

  function renderInventory() {
    var sec = state.ui.invSection;
    var stats = inventoryStats(state.items);
    var seg = $('#inv-seg');
    if (seg) seg.querySelectorAll('button[data-invsec]').forEach(function (b) {
      var k = b.getAttribute('data-invsec');
      b.classList.toggle('active', k === sec);
      var c = b.querySelector('.seg-count');
      if (c) c.textContent = stats[k] ? String(stats[k]) : '';
    });
    var search = $('#inv-search');
    if (search) search.placeholder = 'Search ' + sec;
    var clr = $('#inv-search-clear');
    if (clr) clr.hidden = !invSearch;

    var filters = $('#inv-filters');
    if (filters) {
      filters.hidden = sec !== 'ingredients' || !stats.ingredients;
      filters.innerHTML = sec === 'ingredients' ? filterChipsHtml(stats) : '';
    }
    var host = $('#inv-list');
    if (!host) return;
    var restored = setHtmlKeepingInput(host, sec === 'ingredients' ? ingredientsHtml() : countedHtml(KIND_OF[sec]));
    if (!restored) {
      var ri = host.querySelector('.cat-rename-input');
      if (ri) { ri.focus(); ri.select(); }
    }
  }

  function filterChipsHtml(stats) {
    var f = state.ui.invFilter;
    function chip(val, label, dot) {
      return '<button class="chip' + (f === val ? ' active' : '') + '" data-act="inv-filter" data-val="' + val + '">' +
        (dot ? '<span class="dot ' + dot + '"></span>' : '') + label + '</button>';
    }
    return chip('all', 'All') + chip('low', 'Running low · ' + stats.low, 'low') + chip('out', 'Out · ' + stats.out, 'out');
  }

  function ingredientsHtml() {
    var q = lc(invSearch);
    var f = state.ui.invFilter;
    var all = state.items.filter(function (i) { return i.kind === 'ingredient'; });
    var items = all.filter(function (i) {
      return (!q || lc(i.name).indexOf(q) !== -1 || lc(i.category).indexOf(q) !== -1) && (f === 'all' || i.state === f);
    });
    var browsing = !q && f === 'all';
    var placeholders = browsing ? activePlaceholders(state.ui.inventoryCategories, function (name) {
      return all.some(function (i) { return lc(i.category) === lc(name); });
    }) : [];
    var groups = groupIngredients(items, placeholders);
    var toBuy = toBuyNames();
    var html;
    if (!groups.length) {
      html = q ? emptyHtml('🔍', 'No matches', 'Nothing called “' + esc(invSearch.trim()) + '” in your ingredients.')
        : f !== 'all' ? emptyHtml(f === 'out' ? '🎉' : '👌', f === 'out' ? "You're not out of anything" : 'Nothing running low', 'Nice — the pantry is stocked.')
        : emptyHtml('🥕', 'No ingredients yet', 'Tap <b style="display:inline;font:inherit;color:var(--accent)">+</b> to add one, or start with a category below.');
    } else {
      html = '<div class="cat-grid">' + groups.map(function (g) { return invCategoryHtml(g, !browsing, toBuy); }).join('') + '</div>';
    }
    return html + (browsing ? addCategoryBarHtml('inventory') : '');
  }

  function emptyHtml(icon, title, body) {
    return '<div class="empty"><div class="big">' + icon + '</div><b>' + title + '</b>' + body + '</div>';
  }

  function invCategoryHtml(g, forceOpen, toBuy) {
    var collapsed = !forceOpen && !!state.ui.collapsed[g.name];
    var isUncat = g.name === 'Uncategorized';
    var quickOpen = openInvQuickAdd === g.name;
    var head = renamingInvCat === g.name
      ? '<input class="cat-rename-input" data-keep="rename:' + esc(g.name) + '" type="text" value="' + esc(g.name) + '">'
      : '<button class="cat-toggle" data-act="toggle-group" data-group="' + esc(g.name) + '">' +
        '<span class="cat-emoji">' + catEmojiFor(g.name) + '</span>' +
        '<span class="cat-name">' + esc(g.name) + '</span>' +
        '<span class="cat-count">' + (g.items.length || '') + '</span>' + CHEV + '</button>';
    return '<div class="card' + (collapsed ? ' collapsed' : '') + '" style="--catclr:' + catColorFor(g.name) + '">' +
      '<div class="cat-head">' + head +
      '<button class="icon-btn add" data-act="toggle-inv-quickadd" data-cat="' + esc(g.name) + '" aria-label="Add to ' + esc(g.name) + '">+</button>' +
      '<button class="icon-btn" data-act="toggle-invcat-menu" data-cat="' + esc(g.name) + '" aria-label="Category options">⋯</button>' +
      (openInvCatMenu === g.name ? '<div class="menu">' +
        (isUncat ? '' : '<button data-act="rename-invcat" data-cat="' + esc(g.name) + '">Rename category</button>') +
        (isUncat ? '' : '<button class="danger" data-act="delete-invcat" data-cat="' + esc(g.name) + '">' +
          (g.items.length ? 'Remove category (keep items)' : 'Delete category') + '</button>') +
        '<button data-act="collapse-all">Collapse all</button>' +
        '<button data-act="expand-all">Expand all</button></div>' : '') +
      '</div>' +
      (quickOpen ? '<div class="quick-add-row"><input type="text" class="qa-name" data-keep="qa:' + esc(g.name) + '" placeholder="Add to ' + esc(g.name) + '…" enterkeyhint="done">' +
        '<button class="qa-go" data-act="inv-quick-add-go" data-cat="' + esc(g.name) + '">Add</button></div>' : '') +
      '<div class="rows">' + (g.items.length ? g.items.map(function (it) { return ingredientRow(it, toBuy); }).join('')
        : '<div class="empty small">Empty — tap + to add the first one.</div>') + '</div></div>';
  }

  function ingredientRow(it, toBuy) {
    var note = it.notes ? esc(it.notes) : (it.is_staple ? 'Staple' : '');
    var listed = toBuy[lc(it.name)];
    return '<div class="item-row' + (it.is_staple ? ' staple' : '') + '">' +
      '<button class="item-main" data-act="edit" data-id="' + it.id + '"><span class="item-name">' + esc(it.name) + '</span>' +
      (note ? '<span class="item-note">' + note + '</span>' : '') + '</button>' +
      (listed ? '<span class="on-list" title="On your shopping list">' + CART_MINI + '</span>' : '') +
      '<button class="state-chip ' + it.state + '" data-act="cycle" data-id="' + it.id + '">' + STATE_LABEL[it.state] + '</button>' +
      '</div>';
  }

  function countedHtml(kind) {
    var q = lc(invSearch);
    var all = countedList(state.items, kind);
    var list = all.filter(function (i) { return !q || lc(i.name).indexOf(q) !== -1; });
    if (!list.length) {
      if (q) return emptyHtml('🔍', 'No matches', 'Nothing called “' + esc(invSearch.trim()) + '” here.');
      return kind === 'snack'
        ? emptyHtml('🍿', 'No snacks yet', 'Tap + to add one — chips, biscuits, chocolate… with how many you have.')
        : emptyHtml('🍳', 'No equipment yet', 'Tap + to add your pans, pots, bowls and gadgets, with how many you own.');
    }
    var toBuy = toBuyNames();
    var total = all.reduce(function (n, i) { return n + countOf(i); }, 0);
    var outCount = all.filter(function (i) { return countOf(i) === 0; }).length;
    return '<div class="card">' + list.map(function (it) { return countedRow(it, toBuy); }).join('') + '</div>' +
      '<div class="footnote">' + plural(all.length, kind === 'snack' ? 'snack' : 'item') + ' · ' + total + ' in total' +
      (outCount ? ' · ' + outCount + ' out' : '') + '</div>';
  }

  function countedRow(it, toBuy) {
    var n = countOf(it);
    var note = n === 0
      ? '<span class="item-note bad">' + (it.kind === 'snack' ? (toBuy[lc(it.name)] ? 'Out · on your list' : 'Out') : 'None') + '</span>'
      : (it.notes ? '<span class="item-note">' + esc(it.notes) + '</span>' : '');
    return '<div class="item-row' + (n === 0 ? ' zero' : '') + '">' +
      '<span class="thumb">' + itemEmojiFor(it) + '</span>' +
      '<button class="item-main" data-act="edit" data-id="' + it.id + '"><span class="item-name">' + esc(it.name) + '</span>' + note + '</button>' +
      '<div class="stepper">' +
      '<button data-act="dec" data-id="' + it.id + '" aria-label="One less"' + (n === 0 ? ' disabled' : '') + '>−</button>' +
      '<span class="count">' + n + '</span>' +
      '<button data-act="inc" data-id="' + it.id + '" aria-label="One more">+</button>' +
      '</div></div>';
  }

  function addCategoryBarHtml(ctx) {
    var ph = ctx === 'shop' ? 'New category — Produce, Dairy…' : 'New category — Spices, Dairy…';
    return '<div class="add-category-bar">' +
      '<input type="text" class="add-cat-input" data-keep="addcat:' + ctx + '" placeholder="' + ph + '" enterkeyhint="done">' +
      '<button data-act="add-category" data-ctx="' + ctx + '">+ Add</button></div>';
  }

  function focusFirst(hostSel, innerSel) {
    var host = $(hostSel);
    var el = host && host.querySelector(innerSel);
    if (el) el.focus();
  }

  function renderShopping() {
    var total = state.shoppingItems.length;
    var done = state.shoppingItems.filter(function (i) { return i.checked; }).length;
    var left = total - done;
    var sum = $('#shop-summary');
    if (sum) {
      sum.innerHTML = total ? '<div class="card shop-summary"><div class="ss-top"><div class="grow">' +
        '<div class="ss-big">' + left + '</div><div class="ss-sub">' + (left === 1 ? 'item' : 'items') + ' to buy' +
        (done ? ' · ' + done + ' in the cart' : '') + '</div></div>' +
        (done ? '<button class="pill-btn" data-act="shop-clear-checked">Clear checked</button>' : '') +
        '</div><div class="progress"><span style="width:' + Math.round(done / total * 100) + '%"></span></div></div>' : '';
    }
    var host = $('#shopping-categories');
    if (host) {
      var groups = groupShoppingItems(state.shoppingCategories, state.shoppingItems);
      var html = groups.length ? '<div class="cat-grid">' + groups.map(shoppingCategoryHtml).join('') + '</div>'
        : emptyHtml('🛒', 'Your list is empty', 'Anything you mark <b style="display:inline;font:inherit;color:var(--out)">Out</b> in Inventory lands here automatically. Or tap + to add something.');
      var restored = setHtmlKeepingInput(host, html + addCategoryBarHtml('shop'));
      if (!restored) {
        var renameInput = host.querySelector('.cat-rename-input');
        if (renameInput) { renameInput.focus(); renameInput.select(); }
      }
    }
    var badge = $('#shop-badge');
    if (badge) {
      badge.hidden = !left;
      badge.textContent = left > 99 ? '99+' : String(left);
    }
  }

  function shoppingCategoryHtml(g) {
    var key = g.id || 'uncategorized';
    var collapsed = !!state.ui.collapsedShopping[key];
    var isReal = g.id != null;
    var quickOpen = openShopQuickAdd === key;
    var checkedCount = g.items.filter(function (i) { return i.checked; }).length;
    var countTxt = g.items.length ? (checkedCount + '/' + g.items.length) : '';
    var head = (renamingShopCatId === g.id && isReal)
      ? '<input class="cat-rename-input" data-keep="shoprename:' + g.id + '" type="text" value="' + esc(g.name) + '">'
      : '<button class="cat-toggle" data-act="toggle-shop-group" data-group="' + esc(key) + '">' +
        '<span class="cat-emoji">' + catEmojiFor(g.name) + '</span>' +
        '<span class="cat-name">' + esc(g.name) + '</span>' +
        '<span class="cat-count">' + countTxt + '</span>' + CHEV + '</button>';
    var outNames = {};
    state.items.forEach(function (i) { if (countOf(i) === 0 || i.state === 'out') outNames[lc(i.name)] = true; });
    return '<div class="card' + (collapsed ? ' collapsed' : '') + '" style="--catclr:' + catColorFor(g.name) + '">' +
      '<div class="cat-head">' + head +
      (isReal ? '<button class="icon-btn add" data-act="toggle-shop-quickadd" data-cat="' + g.id + '" aria-label="Add item to ' + esc(g.name) + '">+</button>' : '') +
      (isReal ? '<button class="icon-btn" data-act="toggle-shopcat-menu" data-cat="' + g.id + '" aria-label="Category options">⋯</button>' : '') +
      (isReal && openShopCatMenuId === g.id ? '<div class="menu">' +
        '<button data-act="rename-shopcat" data-cat="' + g.id + '">Rename</button>' +
        '<button class="danger" data-act="delete-shopcat" data-cat="' + g.id + '">Delete</button></div>' : '') +
      '</div>' +
      (quickOpen ? '<div class="quick-add-row"><input type="text" class="qa-name" data-keep="shopqa:' + g.id + '" placeholder="Item" enterkeyhint="done">' +
        '<input type="text" class="qa-qty" data-keep="shopqaqty:' + g.id + '" placeholder="Qty" enterkeyhint="done">' +
        '<button class="qa-go" data-act="shop-quick-add-go" data-cat="' + g.id + '">Add</button></div>' : '') +
      '<div class="rows">' + (g.items.length ? g.items.map(function (it) { return shoppingItemRow(it, outNames); }).join('')
        : '<div class="empty small">Nothing here yet.</div>') + '</div></div>';
  }

  function shoppingItemRow(it, outNames) {
    var fromInv = !it.checked && outNames[lc(it.name)];
    var note = [it.qty ? esc(it.qty) : '', fromInv ? '<span class="src-tag">Out at home</span>' : ''].filter(Boolean).join(' ');
    return '<div class="item-row shop-row' + (it.checked ? ' checked' : '') + '">' +
      '<button class="check" data-act="toggle-shop-item" data-id="' + it.id + '" aria-label="' + (it.checked ? 'Uncheck' : 'Got it') + '">' + CHECK + '</button>' +
      '<button class="item-main" data-act="edit-shop-item" data-id="' + it.id + '"><span class="item-name">' + esc(it.name) + '</span>' +
      (note ? '<span class="item-note">' + note + '</span>' : '') + '</button>' +
      '<button class="row-x" data-act="remove-shop-item" data-id="' + it.id + '" aria-label="Remove">×</button>' +
      '</div>';
  }

  function renderSync() {
    var pill = $('#sync-pill');
    if (!pill) return;
    var cls = 'pill', txt;
    if (!state.online) { cls += ' warn'; txt = 'Offline'; }
    else if (state.syncing) { txt = 'Syncing…'; }
    else if (state.queue.length && state.blocked) { cls += ' warn'; txt = 'Needs DB update'; }
    else if (state.queue.length) { cls += ' warn'; txt = state.queue.length + ' pending'; }
    else { cls += ' ok'; txt = 'Synced'; }
    pill.className = cls;
    pill.textContent = txt;
  }

  // --------------------------------------------------------- bottom sheet
  // One sheet element, rebuilt per mode:
  //   add-item   { section }       edit-item { id }
  //   add-shop   { cat? }          edit-shop { id }
  //   account
  function openSheet(s) {
    sheet = s;
    var it = s.mode === 'edit-item' ? byId(s.id) : null;
    if (s.mode === 'edit-item' && !it) { sheet = null; return; }
    if (sheet.state == null) sheet.state = it ? it.state : 'have';
    if (sheet.count == null) sheet.count = it ? countOf(it) : 1;
    renderSheet();
    if (s.mode === 'add-item' || s.mode === 'add-shop') {
      var n = $('#sh-name');
      if (n) n.focus();
    }
  }
  function closeSheet() {
    sheet = null;
    var el = $('#sheet');
    if (el) el.hidden = true;
  }

  function chipsHtml(names, selected) {
    return '<div class="chips">' + names.map(function (n) {
      return '<button class="chip' + (lc(n) === lc(selected) ? ' active' : '') + '" data-act="sheet-chip" data-val="' + esc(n) + '">' +
        catEmojiFor(n) + ' ' + esc(n) + '</button>';
    }).join('') + '</div>';
  }

  function renderSheet() {
    var wrap = $('#sheet');
    if (!wrap || !sheet) return;
    var card = wrap.querySelector('.card');
    var s = sheet, html = '<div class="grabber"></div>';
    var closeBtn = '<button class="icon-btn" data-act="sheet-close" aria-label="Close">×</button>';

    if (s.mode === 'account') {
      var email = state.session && state.session.user && state.session.user.email;
      var pill = $('#sync-pill');
      html += '<div class="sheet-head"><h2>Account</h2>' + closeBtn + '</div>' +
        '<div class="acct-status"><b>' + esc(email || 'Signed in') + '</b>Sync: ' + esc(pill ? pill.textContent : '') +
        (state.blocked ? '<br><small>Some changes are waiting on a database update — run the newest SQL file in <code>supabase/migrations/</code> in the Supabase SQL editor, then tap Sync now.</small>' : '') +
        '</div>' +
        '<button class="btn-primary" data-act="sync-now">Sync now</button>' +
        '<div class="sheet-actions"><button class="btn-soft danger" data-act="signout">Sign out</button></div>';
      card.innerHTML = html;
      wrap.hidden = false;
      return;
    }

    var isShop = s.mode === 'add-shop' || s.mode === 'edit-shop';
    var it = s.mode === 'edit-item' ? byId(s.id) : null;
    var si = s.mode === 'edit-shop' ? findById(state.shoppingItems, s.id) : null;
    var kind = isShop ? null : (it ? it.kind : KIND_OF[s.section]);
    var editing = !!(it || si);
    var title = isShop ? (editing ? 'Edit item' : 'Add to list')
      : (editing ? 'Edit ' + KIND_LABEL[kind] : 'Add ' + KIND_LABEL[kind]);
    var namePh = isShop ? 'e.g. Tomatoes' : kind === 'snack' ? 'e.g. Salted chips' : kind === 'equipment' ? 'e.g. Frying pan' : 'e.g. Basmati rice';

    html += '<div class="sheet-head"><h2>' + esc(title) + '</h2>' + closeBtn + '</div>';
    html += '<div class="field"><label for="sh-name">Name</label>' +
      '<input id="sh-name" type="text" autocomplete="off" enterkeyhint="' + (editing ? 'done' : 'next') + '" placeholder="' + namePh + '" value="' + esc(it ? it.name : si ? si.name : '') + '"></div>';

    if (isShop) {
      var shopCat = si ? (findById(state.shoppingCategories, si.category_id) || {}).name : (s.cat || '');
      html += '<div class="field"><label for="sh-qty">Quantity <span style="font-weight:500">(optional)</span></label>' +
        '<input id="sh-qty" type="text" autocomplete="off" placeholder="e.g. 2 kg, 1 pack" value="' + esc(si ? si.qty || '' : '') + '"></div>';
      html += '<div class="field"><label for="sh-cat">Category</label>' +
        chipsHtml(sortedShoppingCategories(state.shoppingCategories).map(function (c) { return c.name; }), shopCat) +
        '<input id="sh-cat" type="text" autocomplete="off" placeholder="Pick one above or type a new one" value="' + esc(shopCat || '') + '"></div>';
    } else if (kind === 'ingredient') {
      var cat = it ? (it.category || '') : (s.cat || '');
      html += '<div class="field"><label for="sh-cat">Category</label>' +
        chipsHtml(ingredientCategoryNames(), cat) +
        '<input id="sh-cat" type="text" autocomplete="off" placeholder="Pick one above or type a new one" value="' + esc(cat) + '"></div>';
      html += '<div class="field"><label>Status</label><div class="seg states">' + STATE_CYCLE.map(function (st) {
        return '<button class="' + st + (s.state === st ? ' active' : '') + '" data-act="sheet-state" data-val="' + st + '">' + STATE_LABEL[st] + '</button>';
      }).join('') + '</div></div>';
    } else {
      html += '<div class="field"><label>How many ' + (kind === 'snack' ? 'do you have' : 'do you own') + '?</label>' +
        '<div class="big-stepper"><button data-act="sheet-count" data-d="-1" aria-label="One less">−</button>' +
        '<span class="count" id="sh-count">' + s.count + '</span>' +
        '<button data-act="sheet-count" data-d="1" aria-label="One more">+</button></div></div>';
    }

    if (it) {
      html += '<div class="field"><label for="sh-notes">Notes</label>' +
        '<input id="sh-notes" type="text" autocomplete="off" placeholder="Brand, where it’s kept…" value="' + esc(it.notes || '') + '"></div>';
      if (kind === 'ingredient') {
        html += '<div class="field"><label class="toggle-row"><span>Staple<small>Always around — don’t auto-add to the shopping list when it runs out</small></span>' +
          '<input id="sh-staple" type="checkbox"' + (it.is_staple ? ' checked' : '') + '></label></div>';
      }
    }

    html += '<button class="btn-primary" data-act="sheet-save">' + (editing ? 'Save' : 'Add') + '</button>';
    if (it) {
      html += '<div class="sheet-actions">' +
        (kind !== 'equipment' ? '<button class="btn-soft accent" data-act="sheet-to-list">Add to list</button>' : '') +
        '<button class="btn-soft danger" data-act="sheet-delete">Delete</button></div>';
    } else if (si) {
      html += '<div class="sheet-actions"><button class="btn-soft danger" data-act="sheet-delete">Remove from list</button></div>';
    } else {
      html += '<p class="hint">Tip: press Enter to add and keep going.</p>';
    }
    card.innerHTML = html;
    wrap.hidden = false;
  }

  function sheetVal(sel) { var el = $(sel); return el ? el.value : ''; }

  // keepOpen: Enter-to-add in an add sheet — add, clear the name, stay put
  // for the next one (category / status / count carry over).
  function saveSheet(keepOpen) {
    if (!sheet) return;
    var s = sheet;
    var name = sheetVal('#sh-name').trim();
    if (!name) { var n = $('#sh-name'); if (n) n.focus(); return; }

    if (s.mode === 'add-item') {
      var kind = KIND_OF[s.section];
      var added = kind === 'ingredient'
        ? addItem(kind, name, sheetVal('#sh-cat'), { state: s.state })
        : addItem(kind, name, null, { qty: s.count });
      if (!added) return;
      if (keepOpen) { finishKeepOpen(added.name + ' added'); return; }
    } else if (s.mode === 'edit-item') {
      var it = byId(s.id);
      if (!it) { closeSheet(); return; }
      var patch = {};
      if (name !== it.name) patch.name = name;
      if (it.kind === 'ingredient') {
        var cat = sheetVal('#sh-cat').trim() || null;
        if (cat !== (it.category || null)) patch.category = cat;
        var staple = !!($('#sh-staple') && $('#sh-staple').checked);
        if (staple !== !!it.is_staple) patch.is_staple = staple;
      }
      var notes = sheetVal('#sh-notes').trim() || null;
      if (notes !== (it.notes || null)) patch.notes = notes;
      var id = it.id;
      closeSheet();
      if (Object.keys(patch).length) editItem(id, patch, 'Saved');
      if (it.kind === 'ingredient' && s.state !== it.state) {
        applyStateChange(id, s.state, it.name + ' → ' + STATE_LABEL[s.state]);
      } else if (isCounted(it.kind) && s.count !== countOf(it)) {
        setCount(id, s.count);
      }
      return;
    } else if (s.mode === 'add-shop') {
      var shopCat = addShoppingCategory(sheetVal('#sh-cat').trim() || DEFAULT_SHOP_CATEGORY);
      if (!shopCat || !addShoppingItem(shopCat.id, name, sheetVal('#sh-qty'))) return;
      s.cat = shopCat.name;
      if (keepOpen) { finishKeepOpen(name + ' added to list'); return; }
    } else if (s.mode === 'edit-shop') {
      var si = findById(state.shoppingItems, s.id);
      if (!si) { closeSheet(); return; }
      var sp = {};
      if (name !== si.name) sp.name = name;
      var qty = sheetVal('#sh-qty').trim() || null;
      if (qty !== (si.qty || null)) sp.qty = qty;
      var catName = sheetVal('#sh-cat').trim() || DEFAULT_SHOP_CATEGORY;
      var target = addShoppingCategory(catName);
      if (target && target.id !== si.category_id) sp.category_id = target.id;
      closeSheet();
      if (Object.keys(sp).length) editShoppingItem(si.id, sp);
      return;
    }
    closeSheet();
  }
  function finishKeepOpen(msg) {
    var n = $('#sh-name');
    if (n) { n.value = ''; n.focus(); }
    toast(msg);
  }

  function onSheetTap(act, el) {
    if (act === 'sheet-close') closeSheet();
    else if (act === 'sheet-save') saveSheet(false);
    else if (act === 'sheet-chip') {
      var v = el.getAttribute('data-val');
      var input = $('#sh-cat');
      var turningOff = el.classList.contains('active');
      if (input) input.value = turningOff ? '' : v;
      syncSheetChips();
    }
    else if (act === 'sheet-state') {
      sheet.state = el.getAttribute('data-val');
      el.parentElement.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-val') === sheet.state);
      });
    }
    else if (act === 'sheet-count') {
      sheet.count = Math.max(0, sheet.count + parseInt(el.getAttribute('data-d'), 10));
      var c = $('#sh-count');
      if (c) c.textContent = sheet.count;
    }
    else if (act === 'sheet-delete') {
      var s = sheet;
      closeSheet();
      if (s.mode === 'edit-item') deleteItem(s.id);
      else if (s.mode === 'edit-shop') removeShoppingItem(s.id);
    }
    else if (act === 'sheet-to-list') {
      var id = sheet.id;
      closeSheet();
      addToListFromInventory(id);
    }
    else if (act === 'sync-now') {
      closeSheet();
      reconcile().then(function (ok) { toast(ok ? 'Synced' : "Couldn't sync — check your connection"); });
    }
    else if (act === 'signout') { closeSheet(); signOut(); }
  }
  function syncSheetChips() {
    var v = lc(sheetVal('#sh-cat'));
    var wrap = $('#sheet');
    if (wrap) wrap.querySelectorAll('[data-act="sheet-chip"]').forEach(function (b) {
      b.classList.toggle('active', lc(b.getAttribute('data-val')) === v && v !== '');
    });
  }

  // ------------------------------------------------------------- events
  function closeMenus() {
    var changed = openInvCatMenu || openShopCatMenuId;
    openInvCatMenu = null;
    openShopCatMenuId = null;
    return !!changed;
  }

  function bindEvents() {
    var loginGo = $('#login-go');
    if (loginGo) {
      loginGo.addEventListener('click', doLogin);
      $('#login-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    }

    var tabs = $('nav.tabs');
    if (tabs) tabs.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]');
      if (!b) return;
      var tab = b.getAttribute('data-tab');
      if (tab === state.ui.tab) { window.scrollTo(0, 0); return; }
      state.ui.tab = tab;
      closeMenus();
      persist('ui'); renderAll();
      window.scrollTo(0, 0);
    });

    var seg = $('#inv-seg');
    if (seg) seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-invsec]');
      if (!b) return;
      state.ui.invSection = b.getAttribute('data-invsec');
      invSearch = '';
      var s = $('#inv-search'); if (s) s.value = '';
      closeMenus();
      persist('ui'); renderAll();
    });

    var search = $('#inv-search');
    if (search) {
      search.addEventListener('input', function () { invSearch = search.value; renderInventory(); });
      search.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { search.value = ''; invSearch = ''; renderInventory(); search.blur(); }
        if (e.key === 'Enter') search.blur();
      });
    }
    var clr = $('#inv-search-clear');
    if (clr) clr.addEventListener('click', function (e) {
      e.preventDefault();
      invSearch = ''; if (search) search.value = '';
      renderInventory();
    });

    document.addEventListener('click', function (e) {
      var inMenu = e.target.closest('.menu') || e.target.closest('[data-act="toggle-invcat-menu"]') ||
        e.target.closest('[data-act="toggle-shopcat-menu"]');
      if (!inMenu && closeMenus()) { renderInventory(); renderShopping(); }
    });
    document.addEventListener('click', onTap);

    var sheetEl = $('#sheet');
    if (sheetEl) {
      sheetEl.addEventListener('click', function (e) { if (e.target === sheetEl) closeSheet(); });
      sheetEl.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeSheet(); return; }
        if (e.key !== 'Enter' || !sheet || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
        e.preventDefault();
        var adding = sheet.mode === 'add-item' || sheet.mode === 'add-shop';
        saveSheet(adding);
      });
      sheetEl.addEventListener('input', function (e) { if (e.target.id === 'sh-cat') syncSheetChips(); });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sheet) { closeSheet(); return; }
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (typing || sheet || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/' && state.ui.tab === 'inventory' && search) { e.preventDefault(); search.focus(); }
    });

    ['#inv-list', '#shopping-categories'].forEach(bindListContainer);

    // Hide the floating + while typing in the page (it would sit on top of
    // the inline add buttons, and the keyboard is up anyway).
    var mainEl = $('main');
    if (mainEl) {
      mainEl.addEventListener('focusin', function (e) {
        if (e.target.tagName === 'INPUT') document.body.classList.add('typing');
      });
      mainEl.addEventListener('focusout', function () { document.body.classList.remove('typing'); });
    }
  }

  // Quick-add rows, "+ Add category" bars and inline category rename inputs
  // are rebuilt on every render, so their Enter-to-submit / commit-on-blur
  // wiring is delegated onto the stable container.
  function bindListContainer(hostSel) {
    var host = $(hostSel);
    if (!host) return;
    host.addEventListener('keydown', function (e) {
      var t = e.target;
      if (e.key === 'Escape' && t.classList.contains('cat-rename-input')) {
        renamingInvCat = null; renamingShopCatId = null;
        t.blur(); renderInventory(); renderShopping();
        return;
      }
      if (e.key !== 'Enter') return;
      if (t.classList.contains('qa-name') || t.classList.contains('qa-qty')) {
        var goBtn = t.closest('.quick-add-row').querySelector('.qa-go');
        if (goBtn) goBtn.click();
      } else if (t.classList.contains('add-cat-input')) {
        var addBtn = t.closest('.add-category-bar').querySelector('button');
        if (addBtn) addBtn.click();
      } else if (t.classList.contains('cat-rename-input')) {
        t.blur();
      }
    });
    host.addEventListener('focusout', function (e) {
      var t = e.target;
      if (!t.classList.contains('cat-rename-input')) return;
      if (renamingInvCat) {
        var oldName = renamingInvCat; renamingInvCat = null;
        var v = t.value.trim();
        if (v && v !== oldName) recategorize(oldName, v); else renderInventory();
      } else if (renamingShopCatId) {
        var id = renamingShopCatId; renamingShopCatId = null;
        renameShoppingCategory(id, t.value);
        renderShopping();
      }
    });
  }

  function onTap(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act.indexOf('sheet-') === 0 || act === 'sync-now' || act === 'signout') { onSheetTap(act, el); return; }

    if (act === 'cycle') cycleState(id);
    else if (act === 'inc') stepCount(id, 1);
    else if (act === 'dec') stepCount(id, -1);
    else if (act === 'edit') openSheet({ mode: 'edit-item', id: id });
    else if (act === 'edit-shop-item') openSheet({ mode: 'edit-shop', id: id });
    else if (act === 'open-account') openSheet({ mode: 'account' });
    else if (act === 'fab') {
      if (state.ui.tab === 'shopping') openSheet({ mode: 'add-shop' });
      else openSheet({ mode: 'add-item', section: state.ui.invSection });
    }
    else if (act === 'inv-filter') {
      var f = el.getAttribute('data-val');
      state.ui.invFilter = state.ui.invFilter === f ? 'all' : f;
      persist('ui'); renderInventory();
    }
    else if (act === 'toggle-group') {
      var g = el.getAttribute('data-group');
      if (invSearch || state.ui.invFilter !== 'all') return; // groups are forced open while filtering
      state.ui.collapsed[g] = !state.ui.collapsed[g];
      persist('ui'); renderInventory();
    }
    else if (act === 'collapse-all' || act === 'expand-all') {
      var collapse = act === 'collapse-all';
      closeMenus();
      groupIngredients(state.items, state.ui.inventoryCategories).forEach(function (grp) {
        if (collapse) state.ui.collapsed[grp.name] = true; else delete state.ui.collapsed[grp.name];
      });
      persist('ui'); renderInventory();
    }

    // ---- ingredient category quick-add / management ----
    else if (act === 'toggle-inv-quickadd') {
      var invCat = el.getAttribute('data-cat');
      openInvQuickAdd = (openInvQuickAdd === invCat) ? null : invCat;
      if (openInvQuickAdd) delete state.ui.collapsed[invCat];
      renderInventory();
      focusFirst('#inv-list', '.qa-name');
    }
    else if (act === 'inv-quick-add-go') {
      var invCat2 = el.getAttribute('data-cat');
      var invRow = el.closest('.quick-add-row');
      var invName = invRow && invRow.querySelector('.qa-name');
      if (invName && invName.value.trim()) {
        var v = invName.value;
        invName.value = '';
        addItem('ingredient', v, invCat2 === 'Uncategorized' ? null : invCat2);
        openInvQuickAdd = invCat2;
        renderInventory();
        focusFirst('#inv-list', '.qa-name');
      }
    }
    else if (act === 'toggle-invcat-menu') {
      var mc = el.getAttribute('data-cat');
      openInvCatMenu = openInvCatMenu === mc ? null : mc;
      openShopCatMenuId = null;
      renderInventory();
    }
    else if (act === 'rename-invcat') {
      openInvCatMenu = null;
      renamingInvCat = el.getAttribute('data-cat');
      renderInventory();
    }
    else if (act === 'delete-invcat') {
      var dc = el.getAttribute('data-cat');
      openInvCatMenu = null;
      var hasItems = state.items.some(function (i) { return i.kind === 'ingredient' && lc(i.category) === lc(dc); });
      if (hasItems) recategorize(dc, null); else removeInventoryCategory(dc);
    }
    else if (act === 'add-category') {
      var ctx = el.getAttribute('data-ctx');
      var bar = el.closest('.add-category-bar');
      var catInput = bar && bar.querySelector('.add-cat-input');
      if (catInput && catInput.value.trim()) {
        var catName = catInput.value;
        catInput.value = '';
        if (ctx === 'inventory') addInventoryCategory(catName);
        else addShoppingCategory(catName);
        focusFirst(ctx === 'inventory' ? '#inv-list' : '#shopping-categories', '.add-cat-input');
      }
    }

    // ---- shopping ----
    else if (act === 'toggle-shop-group') {
      var shopGroup = el.getAttribute('data-group');
      state.ui.collapsedShopping[shopGroup] = !state.ui.collapsedShopping[shopGroup];
      persist('ui'); renderShopping();
    }
    else if (act === 'toggle-shop-quickadd') {
      var shopCat = el.getAttribute('data-cat');
      openShopQuickAdd = (openShopQuickAdd === shopCat) ? null : shopCat;
      if (openShopQuickAdd) delete state.ui.collapsedShopping[shopCat];
      renderShopping();
      focusFirst('#shopping-categories', '.qa-name');
    }
    else if (act === 'shop-quick-add-go') {
      var shopCat2 = el.getAttribute('data-cat');
      var shopRow = el.closest('.quick-add-row');
      var shopName = shopRow && shopRow.querySelector('.qa-name');
      var shopQty = shopRow && shopRow.querySelector('.qa-qty');
      if (shopName && shopName.value.trim()) {
        var nm = shopName.value, qt = shopQty ? shopQty.value : '';
        shopName.value = ''; if (shopQty) shopQty.value = '';
        addShoppingItem(shopCat2, nm, qt);
        openShopQuickAdd = shopCat2;
        renderShopping();
        focusFirst('#shopping-categories', '.qa-name');
      }
    }
    else if (act === 'toggle-shop-item') { toggleShoppingItem(id); }
    else if (act === 'remove-shop-item') { removeShoppingItem(id); }
    else if (act === 'toggle-shopcat-menu') {
      var shopCatId = el.getAttribute('data-cat');
      openShopCatMenuId = (openShopCatMenuId === shopCatId) ? null : shopCatId;
      openInvCatMenu = null;
      renderShopping();
    }
    else if (act === 'rename-shopcat') {
      openShopCatMenuId = null;
      renamingShopCatId = el.getAttribute('data-cat');
      renderShopping();
    }
    else if (act === 'delete-shopcat') {
      openShopCatMenuId = null;
      deleteShoppingCategory(el.getAttribute('data-cat'));
    }
    else if (act === 'shop-clear-checked') { clearCheckedShopping(); }
  }

  // -------------------------------------------------------------- auth
  function show(sel) { var el = $(sel); if (el) el.hidden = false; }
  function hide(sel) { var el = $(sel); if (el) el.hidden = true; }

  function doLogin() {
    var err = $('#login-err');
    err.textContent = '';
    var email = $('#login-email').value.trim();
    var password = $('#login-password').value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    if (!client) { err.textContent = 'Offline — connect to the internet to sign in.'; return; }
    $('#login-go').disabled = true;
    Promise.resolve(client.auth.signInWithPassword({ email: email, password: password }))
      .then(function (res) {
        $('#login-go').disabled = false;
        if (res.error) { err.textContent = res.error.message || 'Sign in failed.'; return; }
        state.session = res.data.session;
        hide('#login'); show('#app');
        renderAll();
        reconcile();
      })
      .catch(function () {
        $('#login-go').disabled = false;
        err.textContent = 'Sign in failed.';
      });
  }

  function signOut() {
    if (client && client.auth) { try { client.auth.signOut(); } catch (e) {} }
    state.session = null;
    closeSheet();
    hide('#app'); show('#login');
  }

  // -------------------------------------------------------------- boot
  function initClient() {
    if (client) return;
    var lib = (typeof window !== 'undefined') ? window.supabase : null;
    if (!lib || !lib.createClient) { client = null; return; }
    client = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kitchen.auth.v1' }
    });
  }

  function onOnline() { state.online = true; renderSync(); kickFlush(); }
  function onOffline() { state.online = false; renderSync(); }

  function boot() {
    loadFromCache();
    bindEvents();
    renderAll();
    show('#app');

    initClient();

    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    setInterval(function () { if (state.queue.length) kickFlush(); }, 20000);

    if (!client) { hide('#app'); show('#login'); return Promise.resolve(); }

    return Promise.resolve(client.auth.getSession()).then(function (res) {
      state.session = (res && res.data && res.data.session) || null;
      if (!state.session) { hide('#app'); show('#login'); return; }
      hide('#login'); show('#app');
      renderChrome();
      if (client.auth.onAuthStateChange) {
        client.auth.onAuthStateChange(function (_evt, session) {
          state.session = session || null;
          if (!session) { closeSheet(); hide('#app'); show('#login'); }
        });
      }
      return reconcile();
    }).catch(function () {
      if (!state.session) { hide('#app'); show('#login'); }
    });
  }

  // --------------------------------------------------- test surface
  // Exposed so the jsdom suite can drive the app without a network or DOM.
  window.Kitchen = {
    state: state,
    nextState: nextState,
    countOf: countOf,
    groupIngredients: groupIngredients,
    countedList: countedList,
    inventoryStats: inventoryStats,
    applyOps: applyOps,
    coalesce: coalesce,
    queueFor: queueFor,
    isSchemaError: isSchemaError,
    addItem: addItem,
    cycleState: cycleState,
    applyStateChange: applyStateChange,
    setCount: setCount,
    stepCount: stepCount,
    editItem: editItem,
    deleteItem: deleteItem,
    addInventoryCategory: addInventoryCategory,
    removeInventoryCategory: removeInventoryCategory,
    recategorize: recategorize,
    groupShoppingItems: groupShoppingItems,
    addShoppingCategory: addShoppingCategory,
    renameShoppingCategory: renameShoppingCategory,
    deleteShoppingCategory: deleteShoppingCategory,
    addShoppingItem: addShoppingItem,
    editShoppingItem: editShoppingItem,
    toggleShoppingItem: toggleShoppingItem,
    removeShoppingItem: removeShoppingItem,
    clearCheckedShopping: clearCheckedShopping,
    ensureOnList: ensureOnList,
    addToListFromInventory: addToListFromInventory,
    openSheet: openSheet,
    closeSheet: closeSheet,
    saveSheet: saveSheet,
    enqueue: enqueue,
    flush: flush,
    reconcile: reconcile,
    persist: persist,
    loadFromCache: loadFromCache,
    _setClient: function (c) { client = c; },
    _setSession: function (s) { state.session = s; },
    _reset: function (opts) {
      opts = opts || {};
      flushGen++;
      state.items = opts.items || [];
      state.shoppingCategories = opts.shoppingCategories || [];
      state.shoppingItems = opts.shoppingItems || [];
      state.queue = opts.queue || [];
      state.syncing = false;
      state.blocked = 0;
      invSearch = '';
      persist();
      renderAll();
    }
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { boot(); });
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
