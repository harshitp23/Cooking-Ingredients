<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Inventory</title>
<meta name="description" content="Kitchen inventory, shopping list and recipes">
<meta name="theme-color" content="#e7552d">
<meta name="color-scheme" content="light dark">
<!-- iOS Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --surface-2: #efedea;
    --text: #201d1b;
    --text-dim: #6b6560;
    --border: #e2ded9;
    --accent: #e7552d;
    --have: #2e7d43;
    --have-bg: #e4f0e6;
    --low: #a9741a;
    --low-bg: #f6ecd8;
    --out: #c0392b;
    --out-bg: #f7e0dc;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513;
      --surface: #211e1b;
      --surface-2: #2b2723;
      --text: #f2efec;
      --text-dim: #a49c95;
      --border: #37322d;
      --accent: #ff6a41;
      --have: #7ec98f;
      --have-bg: #1e2f22;
      --low: #e0b064;
      --low-bg: #322a1a;
      --out: #f0897b;
      --out-bg: #35211d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* ---- Login ---- */
  #login {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    gap: 14px; padding: 24px; max-width: 380px; margin: 0 auto;
  }
  #login h1 { font-size: 22px; margin: 0 0 4px; }
  #login p { color: var(--text-dim); margin: 0 0 12px; }
  #login input {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
  }
  #login button {
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  #login .err { color: var(--out); min-height: 20px; font-size: 14px; }

  /* ---- App shell ---- */
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    position: sticky; top: 0; z-index: 20;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header .title { font-weight: 700; font-size: 17px; margin-right: auto; }
  .pill {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim); white-space: nowrap;
  }
  .pill.ok   { background: var(--have-bg); color: var(--have); }
  .pill.warn { background: var(--low-bg); color: var(--low); }
  .pill.bad  { background: var(--out-bg); color: var(--out); }
  .linkbtn { font-size: 13px; color: var(--text-dim); text-decoration: underline; }

  main { flex: 1; padding-bottom: calc(66px + var(--safe-bottom)); }
  section.view { padding: 12px 12px 24px; }

  .addbar {
    position: sticky; z-index: 10;
    top: calc(var(--safe-top) + 52px);
    background: var(--bg); padding: 8px 0 10px;
  }
  .addbar input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
  }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-dim); margin: 18px 4px 8px; }

  .group { margin-bottom: 10px; }
  .group-head {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 8px;
    padding: 10px 6px; font-weight: 600; color: var(--text-dim);
  }
  .group-head .chev { transition: transform .15s; font-size: 12px; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .rows { display: none; }
  .group-count { margin-left: auto; font-weight: 400; font-size: 13px; }

  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px 6px 4px 4px; min-height: 52px;
  }
  .row .name {
    flex: 1; text-align: left; padding: 12px 8px; border-radius: 8px;
    font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .name .note { display: block; font-size: 12px; color: var(--text-dim); }
  .row.staple .name { color: var(--text-dim); }
  .row.staple { opacity: .62; }

  .state {
    min-width: 74px; padding: 10px 8px; border-radius: 10px;
    font-size: 13px; font-weight: 700; text-align: center; text-transform: capitalize;
  }
  .state.have { background: var(--have-bg); color: var(--have); }
  .state.low  { background: var(--low-bg);  color: var(--low); }
  .state.out  { background: var(--out-bg);  color: var(--out); }

  .equip {
    min-width: 96px; padding: 10px 8px; border-radius: 10px; font-size: 13px;
    font-weight: 700; text-align: center; border: 1px solid var(--border);
  }
  .equip.own { background: var(--have-bg); color: var(--have); border-color: transparent; }
  .equip.no  { background: var(--surface-2); color: var(--text-dim); }

  .empty { color: var(--text-dim); text-align: center; padding: 32px 12px; }

  /* ---- Shopping ---- */
  .shop-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 12px; text-align: left; margin-bottom: 6px;
  }
  .shop-item .box {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    flex: none;
  }
  .shop-item .lbl { flex: 1; min-width: 0; }

  .tag {
    font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 7px;
    border-radius: 6px; white-space: nowrap;
  }
  .tag.out { background: var(--out-bg); color: var(--out); }
  .tag.low { background: var(--low-bg); color: var(--low); }
  .tag.have { background: var(--have-bg); color: var(--have); }
  .tag.staple, .tag.oneoff { background: var(--surface-2); color: var(--text-dim); }

  /* ---- Cook ---- */
  .cook-filter { display: flex; gap: 8px; margin: 2px 0 12px; }
  .cook-filter button {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--surface-2); color: var(--text-dim);
  }
  .cook-filter button.active { background: var(--accent); color: #fff; }

  .recipe-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 12px; text-align: left; margin-bottom: 8px;
  }
  .recipe-card .rc-name { font-weight: 600; font-size: 15px; flex: 1; min-width: 60%; }
  .recipe-card .rc-meta { width: 100%; font-size: 12px; color: var(--text-dim); }

  /* ---- Recipe detail (full screen) ---- */
  #recipe-detail {
    position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow: auto;
  }
  #recipe-detail header { position: sticky; top: 0; }
  #recipe-detail .rd-body { padding: 14px 14px calc(40px + var(--safe-bottom)); }
  #rd-back { font-size: 15px; color: var(--accent); margin-right: auto; font-weight: 600; }
  .rd-name {
    width: 100%; font-size: 22px; font-weight: 700; padding: 8px 6px; margin: 4px 0;
    border: none; border-radius: 8px; background: transparent;
  }
  .rd-name:focus { background: var(--surface); outline: 1px solid var(--border); }
  .rd-servings { color: var(--text-dim); font-size: 14px; padding: 0 6px 4px; }
  .rd-servings input {
    width: 58px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }

  .rd-line {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 8px 8px 12px; margin-bottom: 6px;
  }
  .rd-line .rl-name { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-line .rl-qty {
    width: 92px; padding: 7px 8px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .rd-line .rl-del { color: var(--text-dim); font-size: 20px; padding: 4px 8px; line-height: 1; }

  .rd-addline { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .rd-addline input {
    padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  }
  .rd-addline #rd-add-name { flex: 1; min-width: 140px; }
  .rd-addline #rd-add-qty { width: 110px; }
  .rd-addline #rd-add-go { background: var(--accent); color: #fff; font-weight: 600; padding: 11px 16px; border-radius: 10px; }

  #rd-method-view {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 14px 8px 28px; margin: 4px 0; min-height: 48px;
  }
  #rd-method-view li { margin: 6px 0; }
  #rd-method-view .ph { color: var(--text-dim); list-style: none; margin-left: -16px; }
  #rd-method {
    width: 100%; padding: 12px; border-radius: 12px; line-height: 1.5;
    border: 1px solid var(--border); background: var(--surface); resize: vertical;
  }

  /* ---- Bottom tabs ---- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
  }
  nav.tabs button {
    flex: 1; padding: 10px 4px 8px; font-size: 11px; font-weight: 600;
    color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs .ico { font-size: 18px; line-height: 1; }

  /* ---- Edit sheet ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 48; display: flex; align-items: flex-end;
    background: rgba(0,0,0,.35);
  }
  #sheet .card {
    background: var(--surface); width: 100%; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(20px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 560px; margin: 0 auto;
  }
  #sheet label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  #sheet input[type=text], #sheet textarea {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg);
  }
  #sheet .togglerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #sheet .actions { display: flex; gap: 10px; margin-top: 4px; }
  #sheet .actions button { flex: 1; padding: 13px; border-radius: 11px; font-weight: 600; }
  #sheet .save { background: var(--accent); color: #fff; }
  #sheet .cancel { background: var(--surface-2); }
  #sheet .del { background: var(--out-bg); color: var(--out); flex: 0 0 auto; padding: 13px 16px; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 12px; right: 12px; z-index: 60;
    bottom: calc(74px + var(--safe-bottom));
    background: #2b2723; color: #fff; border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28); max-width: 560px; margin: 0 auto;
  }
  #toast .toast-msg { flex: 1; font-size: 14px; }
  #toast .toast-undo {
    color: #ffb59e; font-weight: 700; padding: 6px 4px; font-size: 14px; text-transform: uppercase;
  }

  @media (min-width: 720px) {
    section.view, #recipe-detail .rd-body { max-width: 680px; margin: 0 auto; }
    header > *, nav.tabs { }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Kitchen Inventory</h1>
  <p>Sign in with your account.</p>
  <input id="login-email" type="email" autocomplete="username" inputmode="email" placeholder="Email">
  <input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
  <div class="err" id="login-err"></div>
  <button id="login-go">Sign in</button>
</div>

<div id="app" hidden>
  <header>
    <span class="title">Kitchen</span>
    <span class="pill" id="sync-pill">…</span>
    <button class="linkbtn" id="signout">Sign out</button>
  </header>

  <main>
    <section class="view" id="view-inventory">
      <div class="addbar">
        <input id="add-ingredient" type="text" enterkeyhint="done"
               placeholder="Add ingredient — type &amp; press enter">
      </div>
      <div id="ingredients"></div>

      <h2 class="sec">Equipment</h2>
      <div class="addbar" style="top:auto;position:static;padding-top:0">
        <input id="add-equipment" type="text" enterkeyhint="done"
               placeholder="Add equipment — type &amp; press enter">
      </div>
      <div id="equipment"></div>
    </section>

    <section class="view" id="view-shopping" hidden>
      <div class="addbar">
        <input id="add-oneoff" type="text" enterkeyhint="done"
               placeholder="One-off item (not stocked) — press enter">
      </div>
      <div id="shopping"></div>
    </section>

    <section class="view" id="view-cook" hidden>
      <div class="addbar">
        <input id="add-recipe" type="text" enterkeyhint="done"
               placeholder="Add recipe — name &amp; press enter">
      </div>
      <div class="cook-filter">
        <button data-cookfilter="all" class="active">All recipes</button>
        <button data-cookfilter="makeable">Can make now</button>
      </div>
      <div id="recipes"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="inventory" class="active"><span class="ico">🧺</span>Inventory</button>
    <button data-tab="shopping"><span class="ico">🛒</span>Shopping</button>
    <button data-tab="cook"><span class="ico">🍳</span>Cook</button>
  </nav>
</div>

<div id="recipe-detail" hidden>
  <header>
    <button id="rd-back">‹ Cook</button>
    <span class="pill" id="rd-status"></span>
    <button class="linkbtn" id="rd-delete">Delete</button>
  </header>
  <div class="rd-body">
    <input id="rd-name" class="rd-name" type="text" aria-label="Recipe name">
    <div class="rd-servings">Serves <input id="rd-servings" type="number" min="1" inputmode="numeric"> <span class="rd-lc"></span></div>

    <h2 class="sec">Ingredients</h2>
    <div id="rd-lines"></div>
    <div class="rd-addline">
      <input id="rd-add-name" type="text" placeholder="Ingredient" list="ing-list" enterkeyhint="done">
      <input id="rd-add-qty" type="text" placeholder="Qty" enterkeyhint="done">
      <button id="rd-add-go">Add</button>
    </div>

    <h2 class="sec">Method</h2>
    <ol id="rd-method-view"></ol>
    <textarea id="rd-method" rows="10" placeholder="One step per line…" hidden></textarea>
  </div>
</div>

<div id="sheet" hidden>
  <div class="card">
    <div>
      <label for="sheet-name">Name</label>
      <input id="sheet-name" type="text">
    </div>
    <div>
      <label for="sheet-category">Category</label>
      <input id="sheet-category" type="text" list="cat-list" placeholder="fridge, pantry, spice rack…">
      <datalist id="cat-list"></datalist>
    </div>
    <div class="togglerow">
      <label for="sheet-staple" style="margin:0">Staple — always assumed present, never on the shopping list</label>
      <input id="sheet-staple" type="checkbox">
    </div>
    <div>
      <label for="sheet-notes">Notes</label>
      <textarea id="sheet-notes" rows="2"></textarea>
    </div>
    <div class="actions">
      <button class="del" id="sheet-del">Delete</button>
      <button class="cancel" id="sheet-cancel">Cancel</button>
      <button class="save" id="sheet-save">Save</button>
    </div>
  </div>
</div>

<datalist id="ing-list"></datalist>

<div id="toast" hidden>
  <span class="toast-msg"></span>
  <button class="toast-undo">Undo</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://yjqqzatzzdwpiuiqwisj.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqcXF6YXR6emR3cGl1aXF3aXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDE0MDMsImV4cCI6MjEwNDExNzQwM30.Msz2NfptzXdLAMI-ZDKyVIp3qLAr3ZAtdMli-GRZHJ4';

  var T_ITEMS = 'kitchen_items';
  var T_RECIPES = 'kitchen_recipes';
  var T_RECIPE_ITEMS = 'kitchen_recipe_items';

  var LS = {
    items: 'kitchen.items.v1',
    oneoffs: 'kitchen.oneoffs.v1',
    recipes: 'kitchen.recipes.v1',
    recipeItems: 'kitchen.recipeItems.v1',
    queue: 'kitchen.queue.v1',
    ui: 'kitchen.ui.v1'
  };
  var COLS = {};
  COLS[T_ITEMS] = ['id', 'user_id', 'name', 'kind', 'state', 'category', 'is_staple', 'notes'];
  COLS[T_RECIPES] = ['id', 'user_id', 'name', 'notes', 'instructions', 'servings'];
  COLS[T_RECIPE_ITEMS] = ['id', 'user_id', 'recipe_id', 'item_id', 'display_qty', 'sort_order'];

  var STATE_CYCLE = ['have', 'low', 'out'];

  // ----------------------------------------------------------------- state
  var state = {
    items: [],
    oneoffs: [],
    recipes: [],
    recipeItems: [],
    queue: [],
    ui: { tab: 'inventory', collapsed: {}, cookFilter: 'all' },
    session: null,
    online: (typeof navigator !== 'undefined' && 'onLine' in navigator) ? navigator.onLine : true,
    syncing: false
  };
  var client = null;
  var editingId = null;      // inventory edit sheet
  var openRecipeId = null;    // recipe detail view
  var toastTimer = null;
  var flushGen = 0;          // bumped when the queue is wholesale replaced; aborts any in-flight flush

  // ------------------------------------------------------------- utilities
  function $(sel) { return document.querySelector(sel); }
  function iso() { return new Date().toISOString(); }
  function uid() { return (state.session && state.session.user && state.session.user.id) || null; }
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }
  function cloneRow(r) { var c = {}; for (var k in r) c[k] = r[k]; return c; }
  function merge(a, b) { var c = {}, k; for (k in a) c[k] = a[k]; for (k in b) c[k] = b[k]; return c; }
  function findById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function byId(id) { return findById(state.items, id); }
  function recipeById(id) { return findById(state.recipes, id); }
  function recipeItemById(id) { return findById(state.recipeItems, id); }

  function readLS(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function persist(which) {
    try {
      if (!which || which === 'items') localStorage.setItem(LS.items, JSON.stringify(state.items));
      if (!which || which === 'oneoffs') localStorage.setItem(LS.oneoffs, JSON.stringify(state.oneoffs));
      if (!which || which === 'recipes') localStorage.setItem(LS.recipes, JSON.stringify(state.recipes));
      if (!which || which === 'recipeItems') localStorage.setItem(LS.recipeItems, JSON.stringify(state.recipeItems));
      if (!which || which === 'queue') localStorage.setItem(LS.queue, JSON.stringify(state.queue));
      if (!which || which === 'ui') localStorage.setItem(LS.ui, JSON.stringify(state.ui));
    } catch (e) { /* private mode / quota — the app still works in-memory */ }
  }
  function loadFromCache() {
    state.items = readLS(LS.items, []) || [];
    state.oneoffs = readLS(LS.oneoffs, []) || [];
    state.recipes = readLS(LS.recipes, []) || [];
    state.recipeItems = readLS(LS.recipeItems, []) || [];
    state.queue = readLS(LS.queue, []) || [];
    var ui = readLS(LS.ui, {}) || {};
    state.ui = {
      tab: ui.tab || 'inventory',
      collapsed: ui.collapsed || {},
      cookFilter: ui.cookFilter || 'all'
    };
  }

  // --------------------------------------------------------- pure: domain
  function nextState(s) {
    var i = STATE_CYCLE.indexOf(s);
    return STATE_CYCLE[(i + 1) % STATE_CYCLE.length];
  }

  // Derived shopping list: low/out ingredients that aren't staples, 'out' first,
  // then the localStorage-only one-off items. Equipment can never appear here.
  function deriveShopping(items, oneoffs) {
    var rank = { out: 0, low: 1 };
    var fromInventory = (items || []).filter(function (it) {
      return it.kind === 'ingredient' && !it.is_staple &&
             (it.state === 'low' || it.state === 'out');
    }).map(function (it) {
      return { type: 'item', id: it.id, name: it.name, state: it.state, category: it.category || null };
    }).sort(function (a, b) {
      return (rank[a.state] - rank[b.state]) || a.name.localeCompare(b.name);
    });
    var manual = (oneoffs || []).filter(function (o) { return !o.done; })
      .map(function (o) { return { type: 'oneoff', id: o.id, name: o.name }; });
    return { items: fromInventory, oneoffs: manual };
  }

  function groupIngredients(items) {
    var groups = {};
    (items || []).forEach(function (it) {
      if (it.kind !== 'ingredient') return;
      var key = (it.category && String(it.category).trim()) || 'Uncategorized';
      (groups[key] || (groups[key] = [])).push(it);
    });
    return Object.keys(groups).sort(function (a, b) {
      if (a === 'Uncategorized') return 1;
      if (b === 'Uncategorized') return -1;
      return a.localeCompare(b);
    }).map(function (name) {
      return {
        name: name,
        items: groups[name].slice().sort(function (a, b) {
          return ((a.is_staple ? 1 : 0) - (b.is_staple ? 1 : 0)) || a.name.localeCompare(b.name);
        })
      };
    });
  }

  // "What can I make": a recipe is makeable when none of its non-staple
  // ingredient lines is 'out'. 'low' still counts as makeable (flagged).
  // Equipment lines and staples are ignored.
  function recipeStatus(recipe, recipeItems, items) {
    var idx = {};
    (items || []).forEach(function (it) { idx[it.id] = it; });
    var lines = (recipeItems || []).filter(function (ri) { return ri.recipe_id === recipe.id; });
    var missing = [], low = [];
    lines.forEach(function (ri) {
      var it = idx[ri.item_id];
      if (!it || it.kind !== 'ingredient' || it.is_staple) return;
      if (it.state === 'out') missing.push(it.name);
      else if (it.state === 'low') low.push(it.name);
    });
    var cmp = function (a, b) { return a.localeCompare(b); };
    return {
      makeable: missing.length === 0,
      missing: missing.sort(cmp),
      low: low.sort(cmp),
      total: lines.length
    };
  }

  function cookList(filter) {
    var rows = state.recipes.map(function (r) {
      return { id: r.id, name: r.name, servings: r.servings || null,
               status: recipeStatus(r, state.recipeItems, state.items) };
    });
    if (filter === 'makeable') rows = rows.filter(function (x) { return x.status.makeable; });
    rows.sort(function (a, b) {
      if (a.status.makeable !== b.status.makeable) return a.status.makeable ? -1 : 1;
      if (a.status.missing.length !== b.status.missing.length) return a.status.missing.length - b.status.missing.length;
      return a.name.localeCompare(b.name);
    });
    return rows;
  }

  // Apply queued writes on top of a base list for one table. Idempotent:
  // insert checks existence, update is an absolute field set, delete checks
  // existence — so replaying the same ops yields the same result.
  function applyOps(baseRows, queue, table) {
    var out = (baseRows || []).map(cloneRow);
    var pos = {};
    out.forEach(function (x, i) { pos[x.id] = i; });
    (queue || []).forEach(function (op) {
      if (table && op.table && op.table !== table) return;
      if (op.kind === 'insert') {
        if (!(op.row.id in pos)) { pos[op.row.id] = out.length; out.push(cloneRow(op.row)); }
      } else if (op.kind === 'update') {
        var i = pos[op.id];
        if (i != null) for (var k in op.patch) out[i][k] = op.patch[k];
      } else if (op.kind === 'delete') {
        var j = pos[op.id];
        if (j != null) { out.splice(j, 1); pos = {}; out.forEach(function (x, n) { pos[x.id] = n; }); }
      }
    });
    return out;
  }
  function queueFor(table) {
    return state.queue.filter(function (o) { return o.table === table; });
  }

  // Fold a new op into the pending queue, preserving order + idempotency and
  // collapsing redundant work (repeated taps, create-then-delete offline, …).
  // Ops are matched on (table, id).
  function coalesce(queue, op) {
    var q = (queue || []).slice();
    var i, same;
    var sameRow = function (o) { return o.table === op.table && o.kind === 'insert' && o.row.id === targetId(op); };
    var sameKey = function (o, kind) { return o.table === op.table && o.kind === kind && o.id === targetId(op); };

    if (op.kind === 'insert') {
      for (i = 0; i < q.length; i++) {
        if (q[i].table === op.table && q[i].kind === 'delete' && q[i].id === op.row.id) { q.splice(i, 1); break; }
      }
      q.push(op);
      return q;
    }
    if (op.kind === 'update') {
      for (i = 0; i < q.length; i++) {
        if (sameRow(q[i])) {
          q[i] = { opId: q[i].opId, table: op.table, kind: 'insert', row: merge(q[i].row, op.patch) };
          return q;
        }
        if (sameKey(q[i], 'delete')) return q; // row is being removed — drop the update
      }
      for (i = 0; i < q.length; i++) {
        if (sameKey(q[i], 'update')) {
          q[i] = { opId: q[i].opId, table: op.table, kind: 'update', id: op.id, patch: merge(q[i].patch, op.patch) };
          return q;
        }
      }
      q.push(op);
      return q;
    }
    if (op.kind === 'delete') {
      var hadInsert = false;
      q = q.filter(function (o) {
        if (o.table !== op.table) return true;
        if (o.kind === 'insert' && o.row.id === op.id) { hadInsert = true; return false; }
        if (o.kind === 'update' && o.id === op.id) return false;
        if (o.kind === 'delete' && o.id === op.id) return false;
        return true;
      });
      if (!hadInsert) q.push(op); // created only locally → nothing to delete server-side
      return q;
    }
    return q;
  }
  function targetId(op) { return op.kind === 'insert' ? op.row.id : op.id; }

  // --------------------------------------------------------- write queue
  function enqueue(op) {
    if (!op.opId) op.opId = uuid();
    if (!op.table) op.table = T_ITEMS;
    state.queue = coalesce(state.queue, op);
    persist('queue');
    kickFlush();
  }

  function kickFlush() {
    if (!client || !state.session || !state.online || state.syncing) return;
    flush().catch(function () {});
  }

  // Flush the queue in order. An op is removed ONLY after its send resolves,
  // so a flush that dies partway resumes from the first un-acked op next time;
  // because every send is idempotent, re-sending an op that already landed is
  // harmless.
  function flush(send) {
    send = send || sendOp;
    if (state.syncing) return Promise.resolve({ done: 0, remaining: state.queue.length });
    state.syncing = true;
    renderSync();
    var done = 0;
    var myGen = flushGen;
    function step() {
      if (myGen !== flushGen) return Promise.resolve();
      if (!state.queue.length) return Promise.resolve();
      var op = state.queue[0];
      return Promise.resolve(send(op)).then(function () {
        if (myGen !== flushGen) return;
        if (state.queue[0] === op) { state.queue.shift(); persist('queue'); }
        done++;
        renderSync();
        return step();
      });
    }
    return step().then(function () {
      state.syncing = false; renderSync();
      return { done: done, remaining: 0 };
    }, function (err) {
      state.syncing = false; renderSync();
      return { done: done, remaining: state.queue.length, error: err };
    });
  }

  function sendOp(op) {
    if (!client) return Promise.reject(new Error('no client'));
    var t = client.from(op.table || T_ITEMS);
    var p;
    if (op.kind === 'insert') {
      p = t.upsert(pickCols(op.table, op.row), { onConflict: 'id', ignoreDuplicates: true });
    } else if (op.kind === 'update') {
      p = t.update(op.patch).eq('id', op.id);
    } else if (op.kind === 'delete') {
      p = t.delete().eq('id', op.id);
    } else {
      return Promise.reject(new Error('unknown op ' + op.kind));
    }
    return Promise.resolve(p).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }
  function pickCols(table, row) {
    var out = {}, cols = COLS[table] || COLS[T_ITEMS];
    cols.forEach(function (c) { if (row[c] !== undefined) out[c] = row[c]; });
    return out;
  }

  // --------------------------------------------------------- server sync
  function reconcile() {
    if (!client || !state.session) return Promise.resolve();
    // flush() manages state.syncing itself; don't set it here or flush() no-ops.
    return flush().then(function () {
      state.syncing = true; renderSync();
      return Promise.all([
        client.from(T_ITEMS).select('*'),
        client.from(T_RECIPES).select('*'),
        client.from(T_RECIPE_ITEMS).select('*')
      ]);
    }).then(function (res) {
      res.forEach(function (r) { if (!r || r.error) throw (r && r.error) || new Error('fetch failed'); });
      state.items = applyOps(res[0].data || [], queueFor(T_ITEMS), T_ITEMS);
      state.recipes = applyOps(res[1].data || [], queueFor(T_RECIPES), T_RECIPES);
      state.recipeItems = applyOps(res[2].data || [], queueFor(T_RECIPE_ITEMS), T_RECIPE_ITEMS);
      persist();
      state.syncing = false;
      renderAll();
      return true;
    }, function () {
      state.syncing = false;
      renderSync();
      return false;
    });
  }

  // ------------------------------------------------------- actions: items
  function addItem(kind, name) {
    name = (name || '').trim();
    if (!name) return null;
    var row = {
      id: uuid(), user_id: uid(), name: name, kind: kind, state: 'have',
      category: null, is_staple: false, notes: null, created_at: iso(), updated_at: iso()
    };
    state.items.push(row);
    persist('items'); renderAll();
    enqueue({ table: T_ITEMS, kind: 'insert', row: cloneRow(row) });
    return row;
  }

  // Snapshots the exact prior state (value + updated_at) so undo restores it
  // byte-for-byte, not just "some earlier-looking value".
  function applyStateChange(id, newState, undoLabel) {
    var it = byId(id);
    if (!it || it.state === newState) return;
    var snap = { state: it.state, updated_at: it.updated_at };
    it.state = newState;
    it.updated_at = iso();
    persist('items'); renderAll();
    enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: { state: newState } });
    if (undoLabel) toast(undoLabel, function () {
      var cur = byId(id);
      if (!cur) return;
      cur.state = snap.state;
      cur.updated_at = snap.updated_at;
      persist('items'); renderAll();
      enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: { state: snap.state } });
    });
  }

  function cycleState(id) {
    var it = byId(id);
    if (!it) return;
    applyStateChange(id, nextState(it.state), it.name + ' → ' + nextState(it.state));
  }

  function toggleEquipment(id) {
    var it = byId(id);
    if (!it) return;
    var next = it.state === 'have' ? 'out' : 'have';
    applyStateChange(id, next, it.name + (next === 'have' ? ' — own' : " — don't own"));
  }

  function checkOff(id) {
    var it = byId(id);
    if (!it) return;
    applyStateChange(id, 'have', 'Got ' + it.name);
  }

  function editItem(id, patch, undoLabel) {
    var it = byId(id);
    if (!it) return;
    var before = { updated_at: it.updated_at };
    for (var k in patch) before[k] = it[k];
    for (var j in patch) it[j] = patch[j];
    it.updated_at = iso();
    persist('items'); renderAll();
    enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: cloneRow(patch) });
    if (undoLabel) toast(undoLabel, function () {
      var cur = byId(id);
      if (!cur) return;
      for (var b in before) cur[b] = before[b];
      persist('items'); renderAll();
      var revert = {};
      for (var p in patch) revert[p] = before[p];
      enqueue({ table: T_ITEMS, kind: 'update', id: id, patch: revert });
    });
  }

  function deleteItem(id) {
    var idx = state.items.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var row = state.items.splice(idx, 1)[0];
    // kitchen_recipe_items.item_id is ON DELETE RESTRICT — remove referencing lines first.
    var lines = state.recipeItems.filter(function (ri) { return ri.item_id === id; });
    if (lines.length) state.recipeItems = state.recipeItems.filter(function (ri) { return ri.item_id !== id; });
    persist(); renderAll();
    lines.forEach(function (ri) { enqueue({ table: T_RECIPE_ITEMS, kind: 'delete', id: ri.id }); });
    enqueue({ table: T_ITEMS, kind: 'delete', id: id });
    var extra = lines.length ? ' (removed from ' + lines.length + ' recipe' + (lines.length > 1 ? 's' : '') + ')' : '';
    toast('Deleted ' + row.name + extra, function () {
      state.items.push(row);
      lines.forEach(function (ri) { state.recipeItems.push(ri); });
      persist(); renderAll();
      enqueue({ table: T_ITEMS, kind: 'insert', row: cloneRow(row) });
      lines.forEach(function (ri) { enqueue({ table: T_RECIPE_ITEMS, kind: 'insert', row: cloneRow(ri) }); });
    });
  }

  // ----------------------------------------------------- actions: one-offs
  function addOneoff(name) {
    name = (name || '').trim();
    if (!name) return null;
    var o = { id: uuid(), name: name, done: false, added: Date.now() };
    state.oneoffs.push(o);
    persist('oneoffs'); renderShopping();
    return o;
  }
  function checkOffOneoff(id) {
    var o = findById(state.oneoffs, id);
    if (!o) return;
    o.done = true;
    persist('oneoffs'); renderShopping();
    var remove = setTimeout(function () {
      state.oneoffs = state.oneoffs.filter(function (x) { return x.id !== id; });
      persist('oneoffs');
    }, 5000);
    toast('Got ' + o.name, function () {
      clearTimeout(remove);
      o.done = false;
      persist('oneoffs'); renderShopping();
    });
  }
  function compactOneoffs() {
    var before = state.oneoffs.length;
    state.oneoffs = state.oneoffs.filter(function (o) { return !o.done; });
    if (state.oneoffs.length !== before) persist('oneoffs');
  }

  // ----------------------------------------------------- actions: recipes
  function addRecipe(name) {
    name = (name || '').trim();
    if (!name) return null;
    var r = { id: uuid(), user_id: uid(), name: name, notes: null, instructions: null,
              servings: null, created_at: iso(), updated_at: iso() };
    state.recipes.push(r);
    persist('recipes'); renderAll();
    enqueue({ table: T_RECIPES, kind: 'insert', row: cloneRow(r) });
    return r;
  }

  function editRecipe(id, patch, undoLabel) {
    var r = recipeById(id);
    if (!r) return;
    var before = {};
    for (var k in patch) before[k] = r[k];
    for (var j in patch) r[j] = patch[j];
    r.updated_at = iso();
    persist('recipes'); renderAll();
    enqueue({ table: T_RECIPES, kind: 'update', id: id, patch: cloneRow(patch) });
    if (undoLabel) toast(undoLabel, function () { editRecipe(id, before, null); });
  }

  function deleteRecipe(id) {
    var idx = state.recipes.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var r = state.recipes.splice(idx, 1)[0];
    var lines = state.recipeItems.filter(function (ri) { return ri.recipe_id === id; });
    state.recipeItems = state.recipeItems.filter(function (ri) { return ri.recipe_id !== id; });
    if (openRecipeId === id) closeRecipe();
    persist(); renderAll();
    lines.forEach(function (ri) { enqueue({ table: T_RECIPE_ITEMS, kind: 'delete', id: ri.id }); });
    enqueue({ table: T_RECIPES, kind: 'delete', id: id });
    toast('Deleted ' + r.name, function () {
      state.recipes.push(r);
      lines.forEach(function (ri) { state.recipeItems.push(ri); });
      persist(); renderAll();
      enqueue({ table: T_RECIPES, kind: 'insert', row: cloneRow(r) });
      lines.forEach(function (ri) { enqueue({ table: T_RECIPE_ITEMS, kind: 'insert', row: cloneRow(ri) }); });
    });
  }

  // Add an ingredient line to a recipe. If the ingredient isn't in inventory
  // yet it's created as 'out' (so it lands on the shopping list).
  function addRecipeItem(recipeId, itemName, displayQty) {
    itemName = (itemName || '').trim();
    if (!itemName || !recipeById(recipeId)) return null;
    var existing = null, lname = itemName.toLowerCase();
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].kind === 'ingredient' && state.items[i].name.toLowerCase() === lname) { existing = state.items[i]; break; }
    }
    var item = existing;
    if (!item) {
      item = { id: uuid(), user_id: uid(), name: itemName, kind: 'ingredient', state: 'out',
               category: null, is_staple: false, notes: null, created_at: iso(), updated_at: iso() };
      state.items.push(item);
      enqueue({ table: T_ITEMS, kind: 'insert', row: cloneRow(item) });
    }
    var dup = state.recipeItems.some(function (ri) { return ri.recipe_id === recipeId && ri.item_id === item.id; });
    if (dup) { persist(); renderAll(); return null; }
    var maxSort = state.recipeItems.reduce(function (m, ri) {
      return ri.recipe_id === recipeId ? Math.max(m, ri.sort_order || 0) : m;
    }, 0);
    var line = { id: uuid(), user_id: uid(), recipe_id: recipeId, item_id: item.id,
                 display_qty: (displayQty || '').trim() || null, sort_order: maxSort + 1, created_at: iso() };
    state.recipeItems.push(line);
    persist(); renderAll();
    enqueue({ table: T_RECIPE_ITEMS, kind: 'insert', row: cloneRow(line) });
    return { item: item, line: line, createdItem: !existing };
  }

  function editRecipeItem(id, patch) {
    var line = recipeItemById(id);
    if (!line) return;
    for (var k in patch) line[k] = patch[k];
    persist('recipeItems'); renderAll();
    enqueue({ table: T_RECIPE_ITEMS, kind: 'update', id: id, patch: cloneRow(patch) });
  }

  function removeRecipeItem(id) {
    var idx = state.recipeItems.map(function (x) { return x.id; }).indexOf(id);
    if (idx === -1) return;
    var line = state.recipeItems.splice(idx, 1)[0];
    persist('recipeItems'); renderAll();
    enqueue({ table: T_RECIPE_ITEMS, kind: 'delete', id: id });
    var it = byId(line.item_id);
    toast('Removed ' + (it ? it.name : 'ingredient'), function () {
      state.recipeItems.push(line);
      persist('recipeItems'); renderAll();
      enqueue({ table: T_RECIPE_ITEMS, kind: 'insert', row: cloneRow(line) });
    });
  }

  // -------------------------------------------------------------- toast
  function toast(msg, onUndo) {
    var el = $('#toast');
    if (!el) return;
    el.querySelector('.toast-msg').textContent = msg;
    var btn = el.querySelector('.toast-undo');
    btn.hidden = !onUndo;
    btn.onclick = function () {
      clearTimeout(toastTimer);
      el.hidden = true;
      if (onUndo) onUndo();
    };
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 5000);
  }

  // ------------------------------------------------------------ rendering
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderAll() {
    try {
      renderInventory();
      renderShopping();
      renderCook();
      renderRecipeDetail();
      renderSync();
      renderTabs();
      fillIngredientList();
    } catch (e) { /* jsdom / detached DOM during tests */ }
  }

  function renderTabs() {
    var tabsWrap = $('nav.tabs');
    if (tabsWrap) tabsWrap.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === state.ui.tab);
    });
    [['inventory', '#view-inventory'], ['shopping', '#view-shopping'], ['cook', '#view-cook']]
      .forEach(function (p) { var el = $(p[1]); if (el) el.hidden = state.ui.tab !== p[0]; });
  }

  function renderInventory() {
    var host = $('#ingredients');
    if (host) {
      var groups = groupIngredients(state.items);
      host.innerHTML = groups.length ? groups.map(function (g) {
        var collapsed = !!state.ui.collapsed[g.name];
        return '<div class="group' + (collapsed ? ' collapsed' : '') + '">' +
          '<button class="group-head" data-act="toggle-group" data-group="' + esc(g.name) + '">' +
          '<span class="chev">▼</span>' + esc(g.name) +
          '<span class="group-count">' + g.items.length + '</span></button>' +
          '<div class="rows">' + g.items.map(ingredientRow).join('') + '</div></div>';
      }).join('') : '<div class="empty">No ingredients yet. Add one above.</div>';
    }
    var eqHost = $('#equipment');
    if (eqHost) {
      var eq = state.items.filter(function (i) { return i.kind === 'equipment'; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      eqHost.innerHTML = eq.length ? eq.map(equipmentRow).join('') : '<div class="empty">No equipment yet.</div>';
    }
    fillCategoryList();
  }

  function ingredientRow(it) {
    var note = it.notes ? '<span class="note">' + esc(it.notes) + '</span>' : '';
    return '<div class="row' + (it.is_staple ? ' staple' : '') + '">' +
      '<button class="name" data-act="edit" data-id="' + it.id + '">' + esc(it.name) + note + '</button>' +
      '<button class="state ' + it.state + '" data-act="cycle" data-id="' + it.id + '">' + it.state + '</button>' +
      '</div>';
  }

  function equipmentRow(it) {
    var own = it.state === 'have';
    return '<div class="row">' +
      '<button class="name" data-act="edit" data-id="' + it.id + '">' + esc(it.name) + '</button>' +
      '<button class="equip ' + (own ? 'own' : 'no') + '" data-act="equip" data-id="' + it.id + '">' +
      (own ? 'Own' : "Don't own") + '</button></div>';
  }

  function renderShopping() {
    var host = $('#shopping');
    if (!host) return;
    var list = deriveShopping(state.items, state.oneoffs);
    if (!list.items.length && !list.oneoffs.length) {
      host.innerHTML = '<div class="empty">Nothing to buy. 🎉</div>';
      return;
    }
    host.innerHTML =
      list.items.map(function (r) {
        return '<button class="shop-item" data-act="checkoff" data-id="' + r.id + '">' +
          '<span class="box"></span><span class="lbl">' + esc(r.name) + '</span>' +
          '<span class="tag ' + r.state + '">' + r.state + '</span></button>';
      }).join('') +
      list.oneoffs.map(function (r) {
        return '<button class="shop-item" data-act="checkoff-oneoff" data-id="' + r.id + '">' +
          '<span class="box"></span><span class="lbl">' + esc(r.name) + '</span>' +
          '<span class="tag oneoff">one-off</span></button>';
      }).join('');
  }

  function renderCook() {
    var host = $('#recipes');
    if (!host) return;
    var filter = state.ui.cookFilter || 'all';
    $('#view-cook') && $('#view-cook').querySelectorAll('.cook-filter button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-cookfilter') === filter);
    });
    var rows = cookList(filter);
    if (!rows.length) {
      host.innerHTML = '<div class="empty">' +
        (filter === 'makeable' ? 'Nothing you can make right now.' : 'No recipes yet. Add one above.') +
        '</div>';
      return;
    }
    host.innerHTML = rows.map(function (r) {
      var st = r.status;
      var badge = st.makeable
        ? '<span class="tag have">' + (st.low.length ? 'Low on ' + st.low.length : 'Ready') + '</span>'
        : '<span class="tag out">Need ' + st.missing.length + '</span>';
      var meta = [
        r.status.total + ' ingredient' + (r.status.total === 1 ? '' : 's'),
        r.servings ? 'serves ' + r.servings : null,
        !st.makeable && st.missing.length ? 'missing: ' + st.missing.join(', ') : null
      ].filter(Boolean).join(' · ');
      return '<button class="recipe-card" data-act="open-recipe" data-id="' + r.id + '">' +
        '<span class="rc-name">' + esc(r.name) + '</span>' + badge +
        '<span class="rc-meta">' + esc(meta) + '</span></button>';
    }).join('');
  }

  function renderRecipeDetail() {
    var wrap = $('#recipe-detail');
    if (!wrap) return;
    var r = openRecipeId ? recipeById(openRecipeId) : null;
    if (!r) { wrap.hidden = true; return; }
    wrap.hidden = false;

    var active = document.activeElement;
    var nameEl = $('#rd-name');
    if (nameEl && active !== nameEl) nameEl.value = r.name;
    var servEl = $('#rd-servings');
    if (servEl && active !== servEl) servEl.value = r.servings || '';

    var st = recipeStatus(r, state.recipeItems, state.items);
    var pill = $('#rd-status');
    if (pill) {
      pill.className = 'pill ' + (st.makeable ? 'ok' : 'bad');
      pill.textContent = st.makeable
        ? (st.low.length ? 'Low on ' + st.low.length : 'Can make now')
        : 'Need ' + st.missing.length;
    }

    var lines = state.recipeItems.filter(function (ri) { return ri.recipe_id === r.id; })
      .sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || (a.created_at || '').localeCompare(b.created_at || ''); });
    var linesHost = $('#rd-lines');
    if (linesHost) {
      linesHost.innerHTML = lines.length ? lines.map(function (ri) {
        var it = byId(ri.item_id);
        var name = it ? it.name : '(deleted item)';
        var tagCls = !it ? 'oneoff' : it.is_staple ? 'staple' : it.state;
        var tagTxt = !it ? '—' : it.is_staple ? 'staple' : it.state;
        return '<div class="rd-line">' +
          '<span class="rl-name">' + esc(name) + '</span>' +
          '<input class="rl-qty" data-lineqty="' + ri.id + '" value="' + esc(ri.display_qty || '') + '" placeholder="qty">' +
          '<span class="tag ' + tagCls + '">' + tagTxt + '</span>' +
          '<button class="rl-del" data-act="remove-line" data-id="' + ri.id + '">×</button>' +
          '</div>';
      }).join('') : '<div class="empty">No ingredients yet.</div>';
    }

    var methodView = $('#rd-method-view');
    var methodEdit = $('#rd-method');
    if (methodView && methodEdit && active !== methodEdit) {
      var steps = (r.instructions || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      methodView.innerHTML = steps.length
        ? steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('')
        : '<li class="ph">Tap to add the method — one step per line</li>';
      methodEdit.value = r.instructions || '';
    }
  }

  function renderSync() {
    var pill = $('#sync-pill');
    if (!pill) return;
    var cls = 'pill', txt;
    if (!state.online) { cls += ' warn'; txt = 'Offline'; }
    else if (state.syncing) { txt = 'Syncing…'; }
    else if (state.queue.length) { cls += ' warn'; txt = state.queue.length + ' pending'; }
    else { cls += ' ok'; txt = 'Synced'; }
    pill.className = cls;
    pill.textContent = txt;
  }

  function fillCategoryList() {
    var dl = $('#cat-list');
    if (!dl) return;
    var seen = {};
    state.items.forEach(function (i) { if (i.category) seen[i.category] = true; });
    dl.innerHTML = Object.keys(seen).sort().map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  }
  function fillIngredientList() {
    var dl = $('#ing-list');
    if (!dl) return;
    var names = state.items.filter(function (i) { return i.kind === 'ingredient'; })
      .map(function (i) { return i.name; }).sort();
    dl.innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  }

  // --------------------------------------------------------- edit sheet
  function openSheet(id) {
    var it = byId(id);
    if (!it) return;
    editingId = id;
    $('#sheet-name').value = it.name;
    $('#sheet-category').value = it.category || '';
    $('#sheet-staple').checked = !!it.is_staple;
    $('#sheet-notes').value = it.notes || '';
    $('#sheet-staple').closest('.togglerow').style.display = it.kind === 'equipment' ? 'none' : '';
    $('#sheet').hidden = false;
  }
  function closeSheet() { $('#sheet').hidden = true; editingId = null; }
  function saveSheet() {
    if (!editingId) { closeSheet(); return; }
    var it = byId(editingId);
    if (!it) { closeSheet(); return; }
    var patch = {};
    var name = $('#sheet-name').value.trim();
    if (name && name !== it.name) patch.name = name;
    var cat = $('#sheet-category').value.trim() || null;
    if (cat !== (it.category || null)) patch.category = cat;
    var staple = $('#sheet-staple').checked;
    if (it.kind !== 'equipment' && staple !== !!it.is_staple) patch.is_staple = staple;
    var notes = $('#sheet-notes').value.trim() || null;
    if (notes !== (it.notes || null)) patch.notes = notes;
    var id = editingId;
    closeSheet();
    if (Object.keys(patch).length) editItem(id, patch, 'Saved');
  }

  // ----------------------------------------------------- recipe detail nav
  function openRecipe(id) {
    if (!recipeById(id)) return;
    openRecipeId = id;
    renderRecipeDetail();
  }
  function closeRecipe() {
    openRecipeId = null;
    var wrap = $('#recipe-detail');
    if (wrap) wrap.hidden = true;
  }

  // ------------------------------------------------------------- events
  function onEnter(input, fn) {
    if (!input) return;
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && input.value.trim()) { fn(input.value); input.value = ''; }
    });
  }

  function bindEvents() {
    var loginGo = $('#login-go');
    if (loginGo) {
      loginGo.addEventListener('click', doLogin);
      $('#login-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    }
    var signout = $('#signout');
    if (signout) signout.addEventListener('click', signOut);

    onEnter($('#add-ingredient'), function (v) { addItem('ingredient', v); });
    onEnter($('#add-equipment'), function (v) { addItem('equipment', v); });
    onEnter($('#add-oneoff'), function (v) { addOneoff(v); });
    onEnter($('#add-recipe'), function (v) { var r = addRecipe(v); if (r) openRecipe(r.id); });

    var tabs = $('nav.tabs');
    if (tabs) tabs.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]');
      if (!b) return;
      state.ui.tab = b.getAttribute('data-tab');
      persist('ui'); renderTabs();
    });

    var cook = $('#view-cook');
    if (cook) cook.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-cookfilter]');
      if (!b) return;
      state.ui.cookFilter = b.getAttribute('data-cookfilter');
      persist('ui'); renderCook();
    });

    document.addEventListener('click', onTap);

    var sheet = $('#sheet');
    if (sheet) {
      sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
      $('#sheet-cancel').addEventListener('click', closeSheet);
      $('#sheet-save').addEventListener('click', saveSheet);
      $('#sheet-del').addEventListener('click', function () {
        var id = editingId; closeSheet(); if (id) deleteItem(id);
      });
    }

    // recipe detail
    var back = $('#rd-back'); if (back) back.addEventListener('click', closeRecipe);
    var del = $('#rd-delete'); if (del) del.addEventListener('click', function () {
      if (openRecipeId) deleteRecipe(openRecipeId);
    });
    var rdName = $('#rd-name');
    if (rdName) rdName.addEventListener('change', function () {
      var v = rdName.value.trim();
      if (openRecipeId && v) editRecipe(openRecipeId, { name: v });
    });
    var rdServ = $('#rd-servings');
    if (rdServ) rdServ.addEventListener('change', function () {
      if (!openRecipeId) return;
      var n = parseInt(rdServ.value, 10);
      editRecipe(openRecipeId, { servings: (n && n > 0) ? n : null });
    });
    var rdMethodView = $('#rd-method-view');
    var rdMethod = $('#rd-method');
    if (rdMethodView && rdMethod) {
      rdMethodView.addEventListener('click', function () {
        rdMethodView.hidden = true;
        rdMethod.hidden = false;
        rdMethod.focus();
      });
      rdMethod.addEventListener('blur', function () {
        rdMethod.hidden = true;
        rdMethodView.hidden = false;
        if (openRecipeId) {
          var v = rdMethod.value.trim();
          var cur = (recipeById(openRecipeId) || {}).instructions || '';
          if (v !== cur) editRecipe(openRecipeId, { instructions: v || null });
        }
        renderRecipeDetail();
      });
    }
    var rdAddName = $('#rd-add-name'), rdAddQty = $('#rd-add-qty'), rdAddGo = $('#rd-add-go');
    var doAddLine = function () {
      if (!openRecipeId || !rdAddName.value.trim()) return;
      addRecipeItem(openRecipeId, rdAddName.value, rdAddQty.value);
      rdAddName.value = ''; rdAddQty.value = '';
      rdAddName.focus();
    };
    if (rdAddGo) rdAddGo.addEventListener('click', doAddLine);
    [rdAddName, rdAddQty].forEach(function (el) {
      if (el) el.addEventListener('keydown', function (e) { if (e.key === 'Enter') doAddLine(); });
    });
    var linesHost = $('#rd-lines');
    if (linesHost) linesHost.addEventListener('change', function (e) {
      var qty = e.target.closest('[data-lineqty]');
      if (qty) editRecipeItem(qty.getAttribute('data-lineqty'), { display_qty: qty.value.trim() || null });
    });
  }

  function onTap(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act === 'cycle') cycleState(id);
    else if (act === 'equip') toggleEquipment(id);
    else if (act === 'edit') openSheet(id);
    else if (act === 'checkoff') checkOff(id);
    else if (act === 'checkoff-oneoff') checkOffOneoff(id);
    else if (act === 'open-recipe') openRecipe(id);
    else if (act === 'remove-line') removeRecipeItem(id);
    else if (act === 'toggle-group') {
      var g = el.getAttribute('data-group');
      state.ui.collapsed[g] = !state.ui.collapsed[g];
      persist('ui'); renderInventory();
    }
  }

  // -------------------------------------------------------------- auth
  function show(sel) { var el = $(sel); if (el) el.hidden = false; }
  function hide(sel) { var el = $(sel); if (el) el.hidden = true; }

  function doLogin() {
    var err = $('#login-err');
    err.textContent = '';
    var email = $('#login-email').value.trim();
    var password = $('#login-password').value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    if (!client) { err.textContent = 'Offline — connect to the internet to sign in.'; return; }
    $('#login-go').disabled = true;
    Promise.resolve(client.auth.signInWithPassword({ email: email, password: password }))
      .then(function (res) {
        $('#login-go').disabled = false;
        if (res.error) { err.textContent = res.error.message || 'Sign in failed.'; return; }
        state.session = res.data.session;
        hide('#login'); show('#app');
        renderAll();
        reconcile();
      })
      .catch(function () {
        $('#login-go').disabled = false;
        err.textContent = 'Sign in failed.';
      });
  }

  function signOut() {
    if (client && client.auth) { try { client.auth.signOut(); } catch (e) {} }
    state.session = null;
    closeRecipe();
    hide('#app'); show('#login');
  }

  // -------------------------------------------------------------- boot
  function initClient() {
    if (client) return;
    var lib = (typeof window !== 'undefined') ? window.supabase : null;
    if (!lib || !lib.createClient) { client = null; return; }
    client = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kitchen.auth.v1' }
    });
  }

  function onOnline() { state.online = true; renderSync(); kickFlush(); }
  function onOffline() { state.online = false; renderSync(); }

  function boot() {
    loadFromCache();
    compactOneoffs();
    bindEvents();
    renderAll();
    show('#app');

    initClient();

    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    setInterval(function () { if (state.queue.length) kickFlush(); }, 20000);

    if (!client) { hide('#app'); show('#login'); return Promise.resolve(); }

    return Promise.resolve(client.auth.getSession()).then(function (res) {
      state.session = (res && res.data && res.data.session) || null;
      if (!state.session) { hide('#app'); show('#login'); return; }
      hide('#login'); show('#app');
      if (client.auth.onAuthStateChange) {
        client.auth.onAuthStateChange(function (_evt, session) {
          state.session = session || null;
          if (!session) { closeRecipe(); hide('#app'); show('#login'); }
        });
      }
      return reconcile();
    }).catch(function () {
      if (!state.session) { hide('#app'); show('#login'); }
    });
  }

  // --------------------------------------------------- test surface
  // Exposed so the jsdom suite can drive the app without a network or DOM.
  window.Kitchen = {
    state: state,
    nextState: nextState,
    deriveShopping: deriveShopping,
    groupIngredients: groupIngredients,
    recipeStatus: recipeStatus,
    cookList: cookList,
    applyOps: applyOps,
    coalesce: coalesce,
    queueFor: queueFor,
    addItem: addItem,
    cycleState: cycleState,
    toggleEquipment: toggleEquipment,
    checkOff: checkOff,
    editItem: editItem,
    deleteItem: deleteItem,
    addOneoff: addOneoff,
    checkOffOneoff: checkOffOneoff,
    addRecipe: addRecipe,
    editRecipe: editRecipe,
    deleteRecipe: deleteRecipe,
    addRecipeItem: addRecipeItem,
    editRecipeItem: editRecipeItem,
    removeRecipeItem: removeRecipeItem,
    enqueue: enqueue,
    flush: flush,
    reconcile: reconcile,
    persist: persist,
    loadFromCache: loadFromCache,
    shopping: function () { return deriveShopping(state.items, state.oneoffs); },
    _setClient: function (c) { client = c; },
    _setSession: function (s) { state.session = s; },
    _reset: function (opts) {
      opts = opts || {};
      flushGen++;
      state.items = opts.items || [];
      state.oneoffs = opts.oneoffs || [];
      state.recipes = opts.recipes || [];
      state.recipeItems = opts.recipeItems || [];
      state.queue = opts.queue || [];
      state.syncing = false;
      persist();
      renderAll();
    }
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { boot(); });
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
