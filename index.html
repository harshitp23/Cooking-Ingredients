<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Inventory</title>
<meta name="description" content="Kitchen inventory and shopping list">
<meta name="theme-color" content="#e7552d">
<meta name="color-scheme" content="light dark">
<!-- iOS Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --surface-2: #efedea;
    --text: #201d1b;
    --text-dim: #6b6560;
    --border: #e2ded9;
    --accent: #e7552d;
    --have: #2e7d43;
    --have-bg: #e4f0e6;
    --low: #a9741a;
    --low-bg: #f6ecd8;
    --out: #c0392b;
    --out-bg: #f7e0dc;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513;
      --surface: #211e1b;
      --surface-2: #2b2723;
      --text: #f2efec;
      --text-dim: #a49c95;
      --border: #37322d;
      --accent: #ff6a41;
      --have: #7ec98f;
      --have-bg: #1e2f22;
      --low: #e0b064;
      --low-bg: #322a1a;
      --out: #f0897b;
      --out-bg: #35211d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  [hidden] { display: none !important; }

  /* ---- Login ---- */
  #login {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    gap: 14px; padding: 24px max(24px, env(safe-area-inset-left)); max-width: 420px; margin: 0 auto;
  }
  #login h1 { font-size: 22px; margin: 0 0 4px; }
  #login p { color: var(--text-dim); margin: 0 0 12px; }
  #login input {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
  }
  #login button {
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  #login .err { color: var(--out); min-height: 20px; font-size: 14px; }

  /* ---- App shell ---- */
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    position: sticky; top: 0; z-index: 20;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header .title { font-weight: 700; font-size: 17px; margin-right: auto; }
  .pill {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim); white-space: nowrap;
  }
  .pill.warn { background: var(--low-bg); color: var(--low); }
  .pill.bad  { background: var(--out-bg); color: var(--out); }
  .linkbtn { font-size: 13px; color: var(--text-dim); text-decoration: underline; }

  main { flex: 1; padding-bottom: calc(64px + var(--safe-bottom)); }
  section.view { padding: 12px 12px 24px; }

  .addbar {
    position: sticky; z-index: 10;
    top: calc(var(--safe-top) + 52px);
    background: var(--bg); padding: 8px 0 10px;
  }
  .addbar input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
  }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-dim); margin: 18px 4px 8px; }

  .group { margin-bottom: 10px; }
  .group-head {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 8px;
    padding: 10px 6px; font-weight: 600; color: var(--text-dim);
  }
  .group-head .chev { transition: transform .15s; font-size: 12px; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .rows { display: none; }
  .group-count { margin-left: auto; font-weight: 400; font-size: 13px; }

  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px 6px 4px 4px; min-height: 52px;
  }
  .row .name {
    flex: 1; text-align: left; padding: 12px 8px; border-radius: 8px;
    font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .name .note { display: block; font-size: 12px; color: var(--text-dim); }
  .row.staple .name { color: var(--text-dim); }
  .row.staple { opacity: .62; }

  .state {
    min-width: 74px; padding: 10px 8px; border-radius: 10px;
    font-size: 13px; font-weight: 700; text-align: center; text-transform: capitalize;
  }
  .state.have { background: var(--have-bg); color: var(--have); }
  .state.low  { background: var(--low-bg);  color: var(--low); }
  .state.out  { background: var(--out-bg);  color: var(--out); }

  .equip {
    min-width: 96px; padding: 10px 8px; border-radius: 10px; font-size: 13px;
    font-weight: 700; text-align: center; border: 1px solid var(--border);
  }
  .equip.own { background: var(--have-bg); color: var(--have); border-color: transparent; }
  .equip.no  { background: var(--surface-2); color: var(--text-dim); }

  .empty { color: var(--text-dim); text-align: center; padding: 32px 12px; }

  /* ---- Shopping ---- */
  .shop-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 12px; text-align: left; margin-bottom: 6px;
  }
  .shop-item .box {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    flex: none;
  }
  .shop-item .lbl { flex: 1; min-width: 0; }
  .shop-item .tag {
    font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 7px; border-radius: 6px;
  }
  .tag.out { background: var(--out-bg); color: var(--out); }
  .tag.low { background: var(--low-bg); color: var(--low); }
  .tag.oneoff { background: var(--surface-2); color: var(--text-dim); }

  /* ---- Bottom tabs ---- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
  }
  nav.tabs button {
    flex: 1; padding: 12px 4px 10px; font-size: 12px; font-weight: 600;
    color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs .ico { font-size: 18px; line-height: 1; }

  /* ---- Edit sheet ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end;
    background: rgba(0,0,0,.35);
  }
  #sheet .card {
    background: var(--surface); width: 100%; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(20px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 560px; margin: 0 auto;
  }
  #sheet label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  #sheet input[type=text], #sheet textarea {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg);
  }
  #sheet .togglerow { display: flex; align-items: center; justify-content: space-between; }
  #sheet .actions { display: flex; gap: 10px; margin-top: 4px; }
  #sheet .actions button { flex: 1; padding: 13px; border-radius: 11px; font-weight: 600; }
  #sheet .save { background: var(--accent); color: #fff; }
  #sheet .cancel { background: var(--surface-2); }
  #sheet .del { background: var(--out-bg); color: var(--out); flex: 0 0 auto; padding: 13px 16px; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 12px; right: 12px; z-index: 50;
    bottom: calc(72px + var(--safe-bottom));
    background: #2b2723; color: #fff; border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28); max-width: 560px; margin: 0 auto;
  }
  #toast .toast-msg { flex: 1; font-size: 14px; }
  #toast .toast-undo {
    color: #ffb59e; font-weight: 700; padding: 6px 4px; font-size: 14px; text-transform: uppercase;
  }
  @media (min-width: 620px) {
    .row, .shop-item, .addbar input { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Kitchen Inventory</h1>
  <p>Sign in with your account.</p>
  <input id="login-email" type="email" autocomplete="username" inputmode="email" placeholder="Email">
  <input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
  <div class="err" id="login-err"></div>
  <button id="login-go">Sign in</button>
</div>

<div id="app" hidden>
  <header>
    <span class="title">Kitchen</span>
    <span class="pill" id="sync-pill">…</span>
    <button class="linkbtn" id="signout">Sign out</button>
  </header>

  <main>
    <section class="view" id="view-inventory">
      <div class="addbar">
        <input id="add-ingredient" type="text" enterkeyhint="done"
               placeholder="Add ingredient — type &amp; press enter">
      </div>
      <div id="ingredients"></div>

      <h2 class="sec">Equipment</h2>
      <div class="addbar" style="top:auto;position:static;padding-top:0">
        <input id="add-equipment" type="text" enterkeyhint="done"
               placeholder="Add equipment — type &amp; press enter">
      </div>
      <div id="equipment"></div>
    </section>

    <section class="view" id="view-shopping" hidden>
      <div class="addbar">
        <input id="add-oneoff" type="text" enterkeyhint="done"
               placeholder="One-off item (not stocked) — press enter">
      </div>
      <div id="shopping"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="inventory" class="active"><span class="ico">🧺</span>Inventory</button>
    <button data-tab="shopping"><span class="ico">🛒</span>Shopping</button>
  </nav>
</div>

<div id="sheet" hidden>
  <div class="card">
    <div>
      <label for="sheet-name">Name</label>
      <input id="sheet-name" type="text">
    </div>
    <div>
      <label for="sheet-category">Category</label>
      <input id="sheet-category" type="text" list="cat-list" placeholder="fridge, pantry, spice rack…">
      <datalist id="cat-list"></datalist>
    </div>
    <div class="togglerow">
      <label for="sheet-staple" style="margin:0">Staple (always assumed present, never on shopping list)</label>
      <input id="sheet-staple" type="checkbox">
    </div>
    <div>
      <label for="sheet-notes">Notes</label>
      <textarea id="sheet-notes" rows="2"></textarea>
    </div>
    <div class="actions">
      <button class="del" id="sheet-del">Delete</button>
      <button class="cancel" id="sheet-cancel">Cancel</button>
      <button class="save" id="sheet-save">Save</button>
    </div>
  </div>
</div>

<div id="toast" hidden>
  <span class="toast-msg"></span>
  <button class="toast-undo">Undo</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://yjqqzatzzdwpiuiqwisj.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqcXF6YXR6emR3cGl1aXF3aXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDE0MDMsImV4cCI6MjEwNDExNzQwM30.Msz2NfptzXdLAMI-ZDKyVIp3qLAr3ZAtdMli-GRZHJ4';
  var TABLE = 'kitchen_items';
  var LS = {
    items: 'kitchen.items.v1',
    oneoffs: 'kitchen.oneoffs.v1',
    queue: 'kitchen.queue.v1',
    ui: 'kitchen.ui.v1'
  };
  var ITEM_COLS = ['id', 'user_id', 'name', 'kind', 'state', 'category', 'is_staple', 'notes'];
  var STATE_CYCLE = ['have', 'low', 'out'];

  // ----------------------------------------------------------------- state
  var state = {
    items: [],
    oneoffs: [],
    queue: [],
    ui: { tab: 'inventory', collapsed: {} },
    session: null,
    online: (typeof navigator !== 'undefined' && 'onLine' in navigator) ? navigator.onLine : true,
    syncing: false
  };
  var client = null;
  var editingId = null;
  var toastTimer = null;
  var flushGen = 0; // bumped when the queue is wholesale replaced; aborts any in-flight flush

  // ------------------------------------------------------------- utilities
  function $(sel) { return document.querySelector(sel); }
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }
  function byId(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  function readLS(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function persist(which) {
    try {
      if (!which || which === 'items') localStorage.setItem(LS.items, JSON.stringify(state.items));
      if (!which || which === 'oneoffs') localStorage.setItem(LS.oneoffs, JSON.stringify(state.oneoffs));
      if (!which || which === 'queue') localStorage.setItem(LS.queue, JSON.stringify(state.queue));
      if (!which || which === 'ui') localStorage.setItem(LS.ui, JSON.stringify(state.ui));
    } catch (e) { /* private mode / quota — the app still works in-memory */ }
  }
  function loadFromCache() {
    state.items = readLS(LS.items, []) || [];
    state.oneoffs = readLS(LS.oneoffs, []) || [];
    state.queue = readLS(LS.queue, []) || [];
    var ui = readLS(LS.ui, {}) || {};
    state.ui = { tab: ui.tab || 'inventory', collapsed: ui.collapsed || {} };
  }

  // --------------------------------------------------------- pure: domain
  function nextState(s) {
    var i = STATE_CYCLE.indexOf(s);
    return STATE_CYCLE[(i + 1) % STATE_CYCLE.length];
  }

  // Derived shopping list: low/out ingredients that aren't staples, 'out' first,
  // then the localStorage-only one-off items. Equipment can never appear here.
  function deriveShopping(items, oneoffs) {
    var rank = { out: 0, low: 1 };
    var fromInventory = (items || []).filter(function (it) {
      return it.kind === 'ingredient' && !it.is_staple &&
             (it.state === 'low' || it.state === 'out');
    }).map(function (it) {
      return { type: 'item', id: it.id, name: it.name, state: it.state, category: it.category || null };
    }).sort(function (a, b) {
      return (rank[a.state] - rank[b.state]) || a.name.localeCompare(b.name);
    });
    var manual = (oneoffs || []).filter(function (o) { return !o.done; })
      .map(function (o) { return { type: 'oneoff', id: o.id, name: o.name }; });
    return { items: fromInventory, oneoffs: manual };
  }

  function groupIngredients(items) {
    var groups = {};
    (items || []).forEach(function (it) {
      if (it.kind !== 'ingredient') return;
      var key = (it.category && String(it.category).trim()) || 'Uncategorized';
      (groups[key] || (groups[key] = [])).push(it);
    });
    return Object.keys(groups).sort(function (a, b) {
      if (a === 'Uncategorized') return 1;
      if (b === 'Uncategorized') return -1;
      return a.localeCompare(b);
    }).map(function (name) {
      return {
        name: name,
        items: groups[name].slice().sort(function (a, b) {
          return ((a.is_staple ? 1 : 0) - (b.is_staple ? 1 : 0)) || a.name.localeCompare(b.name);
        })
      };
    });
  }

  // Apply queued writes on top of a base list. Idempotent: running the same
  // op list twice yields the same result (insert checks existence, update is
  // an absolute field set, delete checks existence).
  function applyOps(baseItems, queue) {
    var out = (baseItems || []).map(function (x) {
      var c = {}; for (var k in x) c[k] = x[k]; return c;
    });
    var index = {};
    out.forEach(function (x, i) { index[x.id] = i; });
    (queue || []).forEach(function (op) {
      if (op.kind === 'insert') {
        if (!(op.row.id in index)) { index[op.row.id] = out.length; out.push(cloneRow(op.row)); }
      } else if (op.kind === 'update') {
        var i = index[op.id];
        if (i != null) for (var k in op.patch) out[i][k] = op.patch[k];
      } else if (op.kind === 'delete') {
        var j = index[op.id];
        if (j != null) { out.splice(j, 1); index = {}; out.forEach(function (x, n) { index[x.id] = n; }); }
      }
    });
    return out;
  }
  function cloneRow(r) { var c = {}; for (var k in r) c[k] = r[k]; return c; }

  // Fold a new op into the pending queue, preserving order + idempotency and
  // collapsing redundant work (repeated taps, create-then-delete offline, …).
  function coalesce(queue, op) {
    var q = (queue || []).slice();
    var i;
    if (op.kind === 'insert') {
      for (i = 0; i < q.length; i++) {
        if (q[i].kind === 'delete' && q[i].id === op.row.id) { q.splice(i, 1); break; }
      }
      q.push(op);
      return q;
    }
    if (op.kind === 'update') {
      for (i = 0; i < q.length; i++) {
        if (q[i].kind === 'insert' && q[i].row.id === op.id) {
          q[i] = { kind: 'insert', opId: q[i].opId, row: merge(q[i].row, op.patch) };
          return q;
        }
        if (q[i].kind === 'delete' && q[i].id === op.id) {
          return q; // row is being removed — drop the update
        }
      }
      for (i = 0; i < q.length; i++) {
        if (q[i].kind === 'update' && q[i].id === op.id) {
          q[i] = { kind: 'update', opId: q[i].opId, id: op.id, patch: merge(q[i].patch, op.patch) };
          return q;
        }
      }
      q.push(op);
      return q;
    }
    if (op.kind === 'delete') {
      var hadInsert = false;
      q = q.filter(function (o) {
        if (o.kind === 'insert' && o.row.id === op.id) { hadInsert = true; return false; }
        if (o.kind === 'update' && o.id === op.id) return false;
        if (o.kind === 'delete' && o.id === op.id) return false;
        return true;
      });
      if (!hadInsert) q.push(op); // created only locally → nothing to delete server-side
      return q;
    }
    return q;
  }
  function merge(a, b) { var c = {}; var k; for (k in a) c[k] = a[k]; for (k in b) c[k] = b[k]; return c; }

  // --------------------------------------------------------- write queue
  function enqueue(op) {
    if (!op.opId) op.opId = uuid();
    state.queue = coalesce(state.queue, op);
    persist('queue');
    kickFlush();
  }

  function kickFlush() {
    if (!client || !state.session || !state.online || state.syncing) return;
    flush().catch(function () {});
  }

  // Flush the queue in order. An op is removed ONLY after its send resolves,
  // so a flush that dies partway just resumes from the first un-acked op on
  // the next attempt; because every send is idempotent, re-sending an op that
  // already landed server-side is harmless.
  function flush(send) {
    send = send || sendOp;
    if (state.syncing) return Promise.resolve({ done: 0, remaining: state.queue.length });
    state.syncing = true;
    renderSync();
    var done = 0;
    var myGen = flushGen;
    function step() {
      if (myGen !== flushGen) return Promise.resolve(); // queue was replaced under us
      if (!state.queue.length) return Promise.resolve();
      var op = state.queue[0];
      return Promise.resolve(send(op)).then(function () {
        if (myGen !== flushGen) return;
        if (state.queue[0] === op) { state.queue.shift(); persist('queue'); }
        done++;
        renderSync();
        return step();
      });
    }
    return step().then(function () {
      state.syncing = false; renderSync();
      return { done: done, remaining: 0 };
    }, function (err) {
      state.syncing = false; renderSync();
      return { done: done, remaining: state.queue.length, error: err };
    });
  }

  function sendOp(op) {
    if (!client) return Promise.reject(new Error('no client'));
    var t = client.from(TABLE);
    var p;
    if (op.kind === 'insert') {
      p = t.upsert(pickCols(op.row), { onConflict: 'id', ignoreDuplicates: true });
    } else if (op.kind === 'update') {
      p = t.update(op.patch).eq('id', op.id);
    } else if (op.kind === 'delete') {
      p = t.delete().eq('id', op.id);
    } else {
      return Promise.reject(new Error('unknown op ' + op.kind));
    }
    return Promise.resolve(p).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }
  function pickCols(row) {
    var out = {};
    ITEM_COLS.forEach(function (c) { if (row[c] !== undefined) out[c] = row[c]; });
    return out;
  }

  // --------------------------------------------------------- server sync
  function reconcile() {
    if (!client || !state.session) return Promise.resolve();
    state.syncing = true; renderSync();
    return flush().then(function () {
      return client.from(TABLE).select('*');
    }).then(function (res) {
      if (!res || res.error) throw (res && res.error) || new Error('fetch failed');
      var server = res.data || [];
      state.items = applyOps(server, state.queue);
      persist('items');
      state.syncing = false;
      renderAll();
      return true;
    }, function () {
      state.syncing = false;
      renderSync();
      return false;
    });
  }

  // ------------------------------------------------------------- actions
  function addItem(kind, name) {
    name = (name || '').trim();
    if (!name) return null;
    var row = {
      id: uuid(),
      user_id: (state.session && state.session.user && state.session.user.id) || null,
      name: name, kind: kind, state: 'have',
      category: null, is_staple: false, notes: null,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString()
    };
    state.items.push(row);
    persist('items');
    renderAll();
    enqueue({ kind: 'insert', row: cloneRow(row) });
    return row;
  }

  function applyStateChange(id, newState, prevForUndo, undoLabel) {
    var it = byId(id);
    if (!it) return;
    var prev = prevForUndo !== undefined ? prevForUndo : it.state;
    it.state = newState;
    it.updated_at = new Date().toISOString();
    persist('items');
    renderAll();
    enqueue({ kind: 'update', id: id, patch: { state: newState } });
    if (undoLabel) {
      toast(undoLabel, function () { applyStateChange(id, prev, prev, null); });
    }
  }

  function cycleState(id) {
    var it = byId(id);
    if (!it) return;
    var prev = it.state;
    var next = nextState(prev);
    applyStateChange(id, next, prev, it.name + ' → ' + next);
  }

  function toggleEquipment(id) {
    var it = byId(id);
    if (!it) return;
    var prev = it.state;
    var next = it.state === 'have' ? 'out' : 'have';
    applyStateChange(id, next, prev, it.name + (next === 'have' ? ' — own' : " — don't own"));
  }

  function checkOff(id) {
    var it = byId(id);
    if (!it) return;
    var prev = it.state;
    applyStateChange(id, 'have', prev, 'Got ' + it.name);
  }

  function editItem(id, patch, undoLabel) {
    var it = byId(id);
    if (!it) return;
    var before = {};
    for (var k in patch) before[k] = it[k];
    for (var j in patch) it[j] = patch[j];
    it.updated_at = new Date().toISOString();
    persist('items');
    renderAll();
    enqueue({ kind: 'update', id: id, patch: cloneRow(patch) });
    if (undoLabel) toast(undoLabel, function () { editItem(id, before, null); });
  }

  function deleteItem(id) {
    var idx = -1;
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) { idx = i; break; }
    if (idx === -1) return;
    var row = state.items.splice(idx, 1)[0];
    persist('items');
    renderAll();
    enqueue({ kind: 'delete', id: id });
    toast('Deleted ' + row.name, function () {
      state.items.push(row);
      persist('items');
      renderAll();
      enqueue({ kind: 'insert', row: cloneRow(row) });
    });
  }

  // one-off shopping items — localStorage only, never a kitchen_items row
  function addOneoff(name) {
    name = (name || '').trim();
    if (!name) return null;
    var o = { id: uuid(), name: name, done: false, added: Date.now() };
    state.oneoffs.push(o);
    persist('oneoffs');
    renderShopping();
    return o;
  }
  function checkOffOneoff(id) {
    var o = null;
    for (var i = 0; i < state.oneoffs.length; i++) if (state.oneoffs[i].id === id) o = state.oneoffs[i];
    if (!o) return;
    o.done = true;
    persist('oneoffs');
    renderShopping();
    var remove = setTimeout(function () {
      state.oneoffs = state.oneoffs.filter(function (x) { return x.id !== id; });
      persist('oneoffs');
    }, 5000);
    toast('Got ' + o.name, function () {
      clearTimeout(remove);
      o.done = false;
      persist('oneoffs');
      renderShopping();
    });
  }
  function compactOneoffs() {
    var before = state.oneoffs.length;
    state.oneoffs = state.oneoffs.filter(function (o) { return !o.done; });
    if (state.oneoffs.length !== before) persist('oneoffs');
  }

  // -------------------------------------------------------------- toast
  function toast(msg, onUndo) {
    var el = $('#toast');
    if (!el) return;
    el.querySelector('.toast-msg').textContent = msg;
    var btn = el.querySelector('.toast-undo');
    btn.hidden = !onUndo;
    btn.onclick = function () {
      clearTimeout(toastTimer);
      el.hidden = true;
      if (onUndo) onUndo();
    };
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 5000);
  }

  // ------------------------------------------------------------ rendering
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderAll() {
    try {
      renderInventory();
      renderShopping();
      renderSync();
      renderTabs();
    } catch (e) { /* jsdom / detached DOM during tests */ }
  }

  function renderTabs() {
    var tabsWrap = $('nav.tabs');
    if (tabsWrap) {
      tabsWrap.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === state.ui.tab);
      });
    }
    var inv = $('#view-inventory'), shop = $('#view-shopping');
    if (inv) inv.hidden = state.ui.tab !== 'inventory';
    if (shop) shop.hidden = state.ui.tab !== 'shopping';
  }

  function renderInventory() {
    var host = $('#ingredients');
    if (host) {
      var groups = groupIngredients(state.items);
      if (!groups.length) {
        host.innerHTML = '<div class="empty">No ingredients yet. Add one above.</div>';
      } else {
        host.innerHTML = groups.map(function (g) {
          var collapsed = !!state.ui.collapsed[g.name];
          return '<div class="group' + (collapsed ? ' collapsed' : '') + '">' +
            '<button class="group-head" data-act="toggle-group" data-group="' + esc(g.name) + '">' +
            '<span class="chev">▼</span>' + esc(g.name) +
            '<span class="group-count">' + g.items.length + '</span></button>' +
            '<div class="rows">' + g.items.map(ingredientRow).join('') + '</div></div>';
        }).join('');
      }
    }
    var eqHost = $('#equipment');
    if (eqHost) {
      var eq = state.items.filter(function (i) { return i.kind === 'equipment'; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      eqHost.innerHTML = eq.length
        ? eq.map(equipmentRow).join('')
        : '<div class="empty">No equipment yet.</div>';
    }
    fillCategoryList();
  }

  function ingredientRow(it) {
    var note = it.notes ? '<span class="note">' + esc(it.notes) + '</span>' : '';
    return '<div class="row' + (it.is_staple ? ' staple' : '') + '">' +
      '<button class="name" data-act="edit" data-id="' + it.id + '">' + esc(it.name) + note + '</button>' +
      '<button class="state ' + it.state + '" data-act="cycle" data-id="' + it.id + '">' + it.state + '</button>' +
      '</div>';
  }

  function equipmentRow(it) {
    var own = it.state === 'have';
    return '<div class="row">' +
      '<button class="name" data-act="edit" data-id="' + it.id + '">' + esc(it.name) + '</button>' +
      '<button class="equip ' + (own ? 'own' : 'no') + '" data-act="equip" data-id="' + it.id + '">' +
      (own ? 'Own' : "Don't own") + '</button></div>';
  }

  function renderShopping() {
    var host = $('#shopping');
    if (!host) return;
    var list = deriveShopping(state.items, state.oneoffs);
    if (!list.items.length && !list.oneoffs.length) {
      host.innerHTML = '<div class="empty">Nothing to buy. 🎉</div>';
      return;
    }
    var html = list.items.map(function (r) {
      return '<button class="shop-item" data-act="checkoff" data-id="' + r.id + '">' +
        '<span class="box"></span>' +
        '<span class="lbl">' + esc(r.name) + '</span>' +
        '<span class="tag ' + r.state + '">' + r.state + '</span></button>';
    }).join('');
    html += list.oneoffs.map(function (r) {
      return '<button class="shop-item" data-act="checkoff-oneoff" data-id="' + r.id + '">' +
        '<span class="box"></span>' +
        '<span class="lbl">' + esc(r.name) + '</span>' +
        '<span class="tag oneoff">one-off</span></button>';
    }).join('');
    host.innerHTML = html;
  }

  function renderSync() {
    var pill = $('#sync-pill');
    if (!pill) return;
    var cls = 'pill', txt;
    if (!state.online) { cls += ' warn'; txt = 'Offline'; }
    else if (state.syncing) { txt = 'Syncing…'; }
    else if (state.queue.length) { cls += ' warn'; txt = state.queue.length + ' pending'; }
    else { txt = 'Synced'; }
    pill.className = cls;
    pill.textContent = txt;
  }

  function fillCategoryList() {
    var dl = $('#cat-list');
    if (!dl) return;
    var seen = {};
    state.items.forEach(function (i) {
      if (i.category && !seen[i.category]) seen[i.category] = true;
    });
    dl.innerHTML = Object.keys(seen).sort().map(function (c) {
      return '<option value="' + esc(c) + '">';
    }).join('');
  }

  // --------------------------------------------------------- edit sheet
  function openSheet(id) {
    var it = byId(id);
    if (!it) return;
    editingId = id;
    $('#sheet-name').value = it.name;
    $('#sheet-category').value = it.category || '';
    $('#sheet-staple').checked = !!it.is_staple;
    $('#sheet-notes').value = it.notes || '';
    $('#sheet-staple').closest('.togglerow').style.display = it.kind === 'equipment' ? 'none' : '';
    $('#sheet').hidden = false;
  }
  function closeSheet() { $('#sheet').hidden = true; editingId = null; }
  function saveSheet() {
    if (!editingId) return;
    var it = byId(editingId);
    if (!it) { closeSheet(); return; }
    var patch = {};
    var name = $('#sheet-name').value.trim();
    if (name && name !== it.name) patch.name = name;
    var cat = $('#sheet-category').value.trim() || null;
    if (cat !== (it.category || null)) patch.category = cat;
    var staple = $('#sheet-staple').checked;
    if (it.kind !== 'equipment' && staple !== !!it.is_staple) patch.is_staple = staple;
    var notes = $('#sheet-notes').value.trim() || null;
    if (notes !== (it.notes || null)) patch.notes = notes;
    var id = editingId;
    closeSheet();
    if (Object.keys(patch).length) editItem(id, patch, 'Saved');
  }

  // ------------------------------------------------------------- events
  function bindEvents() {
    var loginGo = $('#login-go');
    if (loginGo) {
      loginGo.addEventListener('click', doLogin);
      $('#login-password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
      });
    }
    var signout = $('#signout');
    if (signout) signout.addEventListener('click', signOut);

    var ai = $('#add-ingredient');
    if (ai) ai.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && ai.value.trim()) { addItem('ingredient', ai.value); ai.value = ''; }
    });
    var ae = $('#add-equipment');
    if (ae) ae.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && ae.value.trim()) { addItem('equipment', ae.value); ae.value = ''; }
    });
    var ao = $('#add-oneoff');
    if (ao) ao.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && ao.value.trim()) { addOneoff(ao.value); ao.value = ''; }
    });

    var tabs = $('nav.tabs');
    if (tabs) tabs.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]');
      if (!b) return;
      state.ui.tab = b.getAttribute('data-tab');
      persist('ui');
      renderTabs();
    });

    document.addEventListener('click', onTap);

    var sheet = $('#sheet');
    if (sheet) {
      sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
      $('#sheet-cancel').addEventListener('click', closeSheet);
      $('#sheet-save').addEventListener('click', saveSheet);
      $('#sheet-del').addEventListener('click', function () {
        var id = editingId;
        closeSheet();
        if (id) deleteItem(id);
      });
    }
  }

  function onTap(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act === 'cycle') cycleState(id);
    else if (act === 'equip') toggleEquipment(id);
    else if (act === 'edit') openSheet(id);
    else if (act === 'checkoff') checkOff(id);
    else if (act === 'checkoff-oneoff') checkOffOneoff(id);
    else if (act === 'toggle-group') {
      var g = el.getAttribute('data-group');
      state.ui.collapsed[g] = !state.ui.collapsed[g];
      persist('ui');
      renderInventory();
    }
  }

  // -------------------------------------------------------------- auth
  function show(sel) { var el = $(sel); if (el) el.hidden = false; }
  function hide(sel) { var el = $(sel); if (el) el.hidden = true; }

  function doLogin() {
    var err = $('#login-err');
    err.textContent = '';
    var email = $('#login-email').value.trim();
    var password = $('#login-password').value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    if (!client) { err.textContent = 'Offline — connect to the internet to sign in.'; return; }
    $('#login-go').disabled = true;
    Promise.resolve(client.auth.signInWithPassword({ email: email, password: password }))
      .then(function (res) {
        $('#login-go').disabled = false;
        if (res.error) { err.textContent = res.error.message || 'Sign in failed.'; return; }
        state.session = res.data.session;
        hide('#login'); show('#app');
        renderAll();
        reconcile();
      })
      .catch(function () {
        $('#login-go').disabled = false;
        err.textContent = 'Sign in failed.';
      });
  }

  function signOut() {
    if (client && client.auth) { try { client.auth.signOut(); } catch (e) {} }
    state.session = null;
    hide('#app'); show('#login');
  }

  // -------------------------------------------------------------- boot
  function initClient() {
    if (client) return;
    var lib = (typeof window !== 'undefined') ? window.supabase : null;
    if (!lib || !lib.createClient) { client = null; return; }
    client = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kitchen.auth.v1' }
    });
  }

  function onOnline() { state.online = true; renderSync(); kickFlush(); }
  function onOffline() { state.online = false; renderSync(); }

  function boot() {
    loadFromCache();
    compactOneoffs();
    bindEvents();
    renderAll();
    show('#app');

    initClient();

    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    setInterval(function () { if (state.queue.length) kickFlush(); }, 20000);

    if (!client) { hide('#app'); show('#login'); return Promise.resolve(); }

    return Promise.resolve(client.auth.getSession()).then(function (res) {
      state.session = (res && res.data && res.data.session) || null;
      if (!state.session) { hide('#app'); show('#login'); return; }
      hide('#login'); show('#app');
      if (client.auth.onAuthStateChange) {
        client.auth.onAuthStateChange(function (_evt, session) {
          state.session = session || null;
          if (!session) { hide('#app'); show('#login'); }
        });
      }
      return reconcile();
    }).catch(function () {
      // couldn't reach auth — run from cache; login still available if needed
      if (!state.session) { hide('#app'); show('#login'); }
    });
  }

  // --------------------------------------------------- test surface
  // Exposed so the jsdom suite can drive the app without a network or DOM.
  window.Kitchen = {
    state: state,
    nextState: nextState,
    deriveShopping: deriveShopping,
    groupIngredients: groupIngredients,
    applyOps: applyOps,
    coalesce: coalesce,
    addItem: addItem,
    cycleState: cycleState,
    toggleEquipment: toggleEquipment,
    checkOff: checkOff,
    editItem: editItem,
    deleteItem: deleteItem,
    addOneoff: addOneoff,
    checkOffOneoff: checkOffOneoff,
    enqueue: enqueue,
    flush: flush,
    reconcile: reconcile,
    persist: persist,
    loadFromCache: loadFromCache,
    shopping: function () { return deriveShopping(state.items, state.oneoffs); },
    _setClient: function (c) { client = c; },
    _setSession: function (s) { state.session = s; },
    _reset: function (items, oneoffs, queue) {
      flushGen++; // abort any in-flight flush from a previous test
      state.items = items || [];
      state.oneoffs = oneoffs || [];
      state.queue = queue || [];
      state.syncing = false;
      persist();
      renderAll();
    }
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { boot(); });
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
